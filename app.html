<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Neural Nest</title>
<meta name="theme-color" content="#0f1224">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neural Nest">
<link rel="manifest" href="app-manifest.json">
<link rel="apple-touch-icon" href="nn-icon-180.png">
<link rel="icon" href="nn-icon-512.png">
<style>
  :root{
    --bg1:#0f1224; --card:#1c2140; --card2:#232a52; --card3:#2a3162;
    --accent:#7de0ff; --accent2:#b48bff; --gold:#ffd166; --green:#6ee7a8;
    --red:#ff6b7a; --text:#eef1ff; --muted:#9aa3c7;
    --font-mono:'Consolas','Courier New',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    color:var(--text); background:#05070f;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  input{font-family:inherit;}
  img.emoji{ height:1em; width:1em; display:inline-block; vertical-align:-0.12em; }

  /* App shell — capped at phone width even on desktop, per the "geared toward
     mobile" brief. Fills the viewport height so the habitat/panel split holds
     regardless of device. */
  #app{
    max-width:480px; margin:0 auto; min-height:100dvh; height:100dvh;
    display:flex; flex-direction:column; position:relative; overflow:hidden;
    background:var(--bg1);
    box-shadow:0 0 60px rgba(0,0,0,.6);
    /* Pushes everything below the OS status bar (clock/battery/signal) on
       phones with a notch/Dynamic Island or a translucent status bar (see
       apple-mobile-web-app-status-bar-style=black-translucent above) — the
       HUD's Shard pill and Shop button were rendering right under those
       system icons without this. 0px on devices that don't report an inset. */
    padding-top:env(safe-area-inset-top,0px);
  }

  /* ============== CREATION SCREEN ============== */
  /* ============== SPLASH / START SCREEN ==============
     "Bioluminescent Nursery" — picked from three mockups (see the splash
     mockups artifact from playtesting). Soft drifting glow blobs + firefly
     twinkle behind a pulsing badge, gradient title tying it to the
     habitat's own warm/cool lighting. The firefly motif also now lives in
     the habitat itself (see .habitat-firefly / #fireflyLayer) — same
     keyframes, so it reads as one consistent visual idea across both
     screens instead of a one-off splash effect. */
  #splashScreen{
    /* Sits above #createScreen (z-index 55 > 50) so it's the very first
       thing shown regardless of whether there's already a save — init()
       still runs its normal boot()/renderCreateScreen() logic underneath,
       unchanged; this is purely a cover screen the Start button dismisses. */
    position:absolute; inset:0; z-index:55; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 15%, #232a5c 0%, #0f1224 55%, #070914 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));
    text-align:center;
  }
  #splashScreen.hidden{ display:none; }
  .splash-blobs span{ position:absolute; border-radius:50%; filter:blur(30px); opacity:.5; animation:splashDrift 9s ease-in-out infinite; }
  .splash-blobs span:nth-child(1){ width:190px; height:190px; background:var(--accent); top:6%; left:-18%; }
  .splash-blobs span:nth-child(2){ width:160px; height:160px; background:var(--accent2); bottom:10%; right:-14%; animation-delay:-3s; }
  .splash-blobs span:nth-child(3){ width:130px; height:130px; background:var(--gold); top:52%; left:58%; opacity:.28; animation-delay:-6s; }
  @keyframes splashDrift{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(14px,-18px) scale(1.12);} }
  .splash-badge{
    width:118px; height:118px; border-radius:30px; position:relative; z-index:2; margin-bottom:24px;
    background:linear-gradient(160deg,#232a5c,#141833); display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(125,224,255,.18), 0 0 34px rgba(125,224,255,.32);
    animation:splashBadgePulse 3.2s ease-in-out infinite;
  }
  @keyframes splashBadgePulse{
    0%,100%{ box-shadow:0 0 0 1px rgba(125,224,255,.18), 0 0 34px rgba(125,224,255,.32); }
    50%{ box-shadow:0 0 0 1px rgba(125,224,255,.3), 0 0 58px rgba(125,224,255,.55); }
  }
  #splashScreen img{ width:78px; height:78px; border-radius:20px; }
  #splashScreen h1{
    position:relative; z-index:2; font-size:1.9rem; font-weight:800; margin:0 0 8px; letter-spacing:-.01em;
    background:linear-gradient(120deg,#eef1ff,#bfe9ff 60%,var(--accent2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #splashScreen p{ position:relative; z-index:2; font-size:.84rem; color:var(--muted); margin:0 0 36px; max-width:270px; line-height:1.55; }
  #splashStartBtn{
    position:relative; z-index:2;
    background:linear-gradient(160deg,var(--accent),var(--accent2)); color:#08101f; font-weight:700;
    border:none; border-radius:999px; padding:15px 48px; font-size:.96rem; cursor:pointer;
    box-shadow:0 10px 26px rgba(125,224,255,.4);
  }
  /* Firefly motif — same idea reused in the habitat SVG below
     (.habitat-firefly / fireflyTwinkleHabitat) so it reads as one
     consistent visual language across both screens, but as two separate
     keyframe rules rather than one shared one: this element is a plain
     HTML span (CSS px world), the habitat version is an SVG <circle>
     (viewBox-unit world, ~1.34px per unit on a typical phone) — a single
     shared translateY distance would either be imperceptible in the SVG or
     wildly oversized on the splash, so each gets its own tuned amount. */
  @keyframes fireflyTwinkleSplash{ 0%,100%{ opacity:0; transform:translateY(0);} 50%{ opacity:1; transform:translateY(-10px);} }
  .splash-fireflies{ position:absolute; inset:0; z-index:1; }
  .splash-fireflies span{
    position:absolute; width:3px; height:3px; border-radius:50%; background:var(--gold);
    box-shadow:0 0 6px 2px rgba(255,209,102,.7); animation:fireflyTwinkleSplash 3.6s ease-in-out infinite;
  }
  /* Habitat's own version of the same firefly motif (see #fireflyLayer in
     houseSVG()) — an SVG <circle>, so its local coordinate system is
     viewBox units (~1.34px/unit on a typical phone), not CSS px like the
     splash span above; -3 there reads as roughly the same visible drift as
     the splash's -10px once that scale factor is accounted for.
     transform-box:fill-box anchors the translate/glow to the circle's own
     center instead of the SVG's origin. box-shadow doesn't render on SVG
     shapes, so the glow uses an SVG-safe drop-shadow filter instead. */
  .habitat-firefly{
    animation:fireflyTwinkleHabitat 3.6s ease-in-out infinite;
    transform-box:fill-box; transform-origin:center;
    filter:drop-shadow(0 0 2.5px rgba(255,209,102,.85));
  }
  @keyframes fireflyTwinkleHabitat{ 0%,100%{ opacity:0; transform:translateY(0);} 50%{ opacity:1; transform:translateY(-3);} }

  #createScreen{
    /* inset:0 anchors to #app's PADDING box, which — per spec — starts at
       #app's border edge, not past #app's own padding-top. #app's
       safe-area-inset-top padding (added for the HUD) never applied here
       because of that: this being position:absolute directly off #app
       rather than a normal-flow child meant it always ignored that padding
       and started right under the status bar again. Adding the same inset
       directly to this screen's own top padding fixes it independently. */
    position:absolute; inset:0; z-index:50; background:var(--bg1);
    display:flex; flex-direction:column;
    padding:calc(22px + env(safe-area-inset-top,0px)) 18px 18px; overflow-y:auto;
  }
  #createScreen.hidden{ display:none; }
  .create-title{ font-size:1.3rem; font-weight:700; text-align:center; margin:8px 0 2px; }
  .create-sub{ font-size:.78rem; color:var(--muted); text-align:center; margin-bottom:16px; line-height:1.5; }
  .bank-banner{
    background:rgba(255,209,102,.1); border:1px solid rgba(255,209,102,.3);
    border-radius:10px; padding:8px 12px; font-size:.75rem; color:var(--gold);
    text-align:center; margin-bottom:14px;
  }
  .species-card{
    background:var(--card2); border-radius:16px; padding:13px 14px; display:flex; gap:12px;
    align-items:center; margin-bottom:10px; border:2px solid transparent; cursor:pointer;
    text-align:left; width:100%;
  }
  .species-card.selected{ border-color:var(--accent); background:var(--card3); }
  .species-card .big-icon{ width:52px; height:52px; flex-shrink:0; }
  .species-card .meta{ flex:1; min-width:0; }
  .species-card .meta .nm{ font-weight:700; font-size:.92rem; }
  .species-card .meta .vb{ font-size:.68rem; color:var(--muted); margin:2px 0 6px; line-height:1.35; }
  .preview-strip{ display:flex; align-items:center; gap:6px; }
  .preview-strip .next-label{ font-size:.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .preview-strip img.silhouette{ width:18px; height:18px; filter:brightness(0) invert(1); opacity:.35; }
  .name-field{ margin-top:14px; margin-bottom:12px; }
  .name-field label{ font-size:.7rem; color:var(--muted); display:block; margin-bottom:5px; }
  .name-field input{
    width:100%; background:#0f1224; border:1px solid rgba(255,255,255,.14);
    border-radius:10px; padding:11px 13px; color:var(--text); font-size:.9rem;
  }
  .cta-btn{
    background:linear-gradient(160deg,var(--accent),var(--accent2)); color:#08101f; font-weight:700;
    border:none; border-radius:12px; padding:14px; text-align:center; font-size:.92rem;
    cursor:pointer; width:100%;
  }
  .cta-btn:disabled{ opacity:.4; cursor:default; }
  .hof-mini-link{ text-align:center; margin-top:14px; font-size:.72rem; color:var(--muted); text-decoration:underline; cursor:pointer; }

  /* ============== HABITAT (home screen) ============== */
  /* Background matches the room SVG's own wall-gradient top tone — now that
     the SVG sizing bug above is fixed, the scene's real aspect ratio (280:200)
     is noticeably wider than this card's, so "meet" (no cropping) leaves a
     letterbox gap above the art rather than cutting off the window/shelf at
     the sides the way "slice" did. Matching the color here means that gap
     just reads as "more wall," not a blank strip. */
  #habitatCard{ position:relative; width:100%; flex:0 0 52%; overflow:hidden; background:#2b3162; }
  /* #houseSvgWrap had no explicit size, so its <svg> child's height:100% had
     nothing real to resolve against and fell back to the viewBox's own
     aspect ratio — leaving the SVG about 268px tall inside a 422px card
     instead of actually filling it (everything below just looked like
     empty/dark space). Pinning the wrap to inset:0 gives the svg a real
     100% to fill. */
  #houseSvgWrap{ position:absolute; inset:0; }
  /* Was #habitatCard svg — an ID selector, so it beat any class-based rule
     no matter how it was written. That's fine as long as the *room* SVG is
     the only <svg> under #habitatCard, but the stink-line indicators added
     later are also raw inline <svg> elsewhere inside #habitatCard, and this
     rule force-stretched them to width:100%/height:100% of their own
     (auto-sized) span too, blowing their explicit 12x26px sizing up huge.
     Scoped to the room wrapper specifically so it only ever touches the
     room background. */
  #houseSvgWrap svg{ width:100%; height:100%; display:block; }
  .hud{ position:absolute; top:16px; left:0; right:0; display:flex; justify-content:space-between; padding:0 12px; z-index:10; }
  .pill{
    background:rgba(5,7,15,.6); backdrop-filter:blur(3px); border:1px solid rgba(255,255,255,.09);
    border-radius:999px; padding:5px 10px; font-size:.72rem; display:flex; align-items:center; gap:5px;
  }
  .pill img{ width:14px; height:14px; }
  .pill-btn{ color:var(--text); font-size:.72rem; font-weight:600; border:1px solid rgba(255,255,255,.09); cursor:pointer; }
  .pill-btn .ic{ font-size:.85rem; }
  /* Pet wrap is now the single positioning root for the pet AND everything
     that needs to visually travel with it (aura, hearts, care FX, evolve
     FX) — they're nested inside it in the markup, so fixing the pet's
     position (floor vs wall) automatically fixes all of them at once
     instead of needing separate .wall overrides scattered per-element like
     before. Fixed width so child percentage/pixel anchors are predictable. */
  .pet-wrap{
    position:absolute; left:50%; bottom:25%; width:120px; transform:translateX(-50%); z-index:5; text-align:center;
    cursor:pointer;
  }
  .pet-wrap:active img{ transform:scale(.93); }
  .pet-wrap img{
    position:relative; z-index:2; width:100px; height:100px;
    filter:drop-shadow(0 8px 14px rgba(0,0,0,.4));
  }
  /* Pet-tap squish feedback, ported from the original build's petByte()/
     petSquish (same easing/scale) — but replayed by toggling this class on
     #petSquish (a plain wrapper with no animation of its own otherwise)
     instead of writing to .style.animation on #petImg or #petWrap. See the
     markup comment above #petSquish for why that distinction matters. */
  .pet-squish{ display:block; }
  .pet-squish.squish-active{ animation:petSquish .35s ease; }
  @keyframes petSquish{
    0%{ transform:scale(1,1); }
    35%{ transform:scale(.92,1.1); }
    100%{ transform:scale(1,1); }
  }
  /* Idle energy: a small continuous bob (every hatched stage — eggs have no
     legs, so they keep their own glow/shake instead, see .egg-mystery) plus
     occasional bigger random hops (triggered from JS, see scheduleRandomHop)
     for personality between walk-cycle turns. Both live on #petSquish, never
     on #petWrap/#petImg, so they can't touch position or facing — same
     reasoning as the squish-tap feedback above. Composes fine with the
     wrap's own walkPosition hop since they're on different elements (nested
     transforms stack, they don't fight over one 'transform' property).
     idle-bob is on nearly every hatched pet nearly all the time, so the
     squish-active/big-hop combos below are written as their own compound
     selectors (3 classes > 2) to reliably win the cascade over plain
     .idle-bob, instead of depending on which rule happens to come last. */
  .pet-squish.idle-bob{ animation:petIdleBob 1.7s ease-in-out infinite; }
  @keyframes petIdleBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }
  .pet-squish.idle-bob.squish-active{ animation:petSquish .35s ease, petIdleBob 1.7s ease-in-out infinite; }
  .pet-squish.big-hop{ animation:petBigHop .55s cubic-bezier(.34,1.56,.64,1); }
  .pet-squish.idle-bob.big-hop{ animation:petBigHop .55s cubic-bezier(.34,1.56,.64,1); }
  @keyframes petBigHop{
    0%{ transform:translateY(0) scale(1,1); }
    30%{ transform:translateY(-16px) scale(1.06,.9); }
    55%{ transform:translateY(-16px) scale(.95,1.08); }
    80%{ transform:translateY(2px) scale(1.05,.94); }
    100%{ transform:translateY(0) scale(1,1); }
  }
  /* Walking (every floor-anchored, non-egg stage): the wrap itself paces
     side to side across the rug with a hop right before each turn, while
     the image independently flips to face whichever direction it's
     currently heading. Two separate elements/animations (wrap = position,
     img = facing+hop) so the flip never mirrors the wrap's non-symmetric
     children (hearts/FX). Most of this roster's art (t-rex, sauropod,
     dragon, eagle, phoenix, chick, tropical fish…) faces LEFT by default —
     scaleX(1)/no-flip is used while heading left, scaleX(-1) flips it to
     face right; getting this backwards is exactly what made later stages
     look like they were walking in reverse.

     --walk-duration/--walk-range/--hop-height are set per species+stage in
     JS (see motionProfile) so pets don't all pace the exact same path at
     the exact same cadence — the 0.15 fraction of --walk-range at the
     hop keyframes matches the original fixed 12px-of-80px ratio, just
     rescaled to whatever range this pet got. Falls back to the original
     fixed values if the variables are ever unset (e.g. debug tooling). */
  /* Fallback shape (species class missing) — kept as the original single
     hop-per-leg arc. */
  .pet-wrap.walking{ animation:walkPosition var(--walk-duration,9s) ease-in-out infinite; }
  @keyframes walkPosition{
    0%   { transform:translateX(calc(-50% + var(--walk-range,80px))); }
    38%  { transform:translateX(calc(-50% + var(--walk-range,80px) * 0.15)) translateY(calc(var(--hop-height,18px) * -1)); }
    50%  { transform:translateX(calc(-50% - var(--walk-range,80px))); }
    88%  { transform:translateX(calc(-50% - var(--walk-range,80px) * 0.15)) translateY(calc(var(--hop-height,18px) * -1)); }
    100% { transform:translateX(calc(-50% + var(--walk-range,80px))); }
  }
  /* ---- Per-species walk SHAPE (distinct from motionProfile's per-species
     PACE) — three species families were all tracing the identical single
     up-then-down arc each leg, just at different speeds/ranges. That's the
     "same upside-down-V pattern" playtesters kept calling out. Each family
     now runs its own @keyframes with a genuinely different silhouette:
       sky  (birds)    — quick double-hop skitter, two bounces per leg
       wyrm (reptiles) — slow heavy lumber, single low hop with a stance
                          pause at each extreme before it moves again
       tide (aquatic)  — continuous low glide, no discrete hop at all
     JS (renderPet) sets .walk-sky/.walk-wyrm/.walk-tide on #petWrap
     alongside .walking to pick one of these; petWalkFace's direction flip
     stays shared since every shape below still crosses to its mirrored
     extreme at exactly 50%. */
  .pet-wrap.walking.walk-sky{ animation:walkPositionSky var(--walk-duration,9s) cubic-bezier(.34,1.56,.64,1) infinite; }
  @keyframes walkPositionSky{
    0%   { transform:translateX(calc(-50% + var(--walk-range,80px))); }
    12%  { transform:translateX(calc(-50% + var(--walk-range,80px) * 0.55)) translateY(calc(var(--hop-height,18px) * -1)); }
    24%  { transform:translateX(calc(-50% + var(--walk-range,80px) * 0.15)); }
    38%  { transform:translateX(calc(-50% - var(--walk-range,80px) * 0.25)) translateY(calc(var(--hop-height,18px) * -0.85)); }
    50%  { transform:translateX(calc(-50% - var(--walk-range,80px))); }
    62%  { transform:translateX(calc(-50% - var(--walk-range,80px) * 0.55)) translateY(calc(var(--hop-height,18px) * -1)); }
    74%  { transform:translateX(calc(-50% - var(--walk-range,80px) * 0.15)); }
    88%  { transform:translateX(calc(-50% + var(--walk-range,80px) * 0.25)) translateY(calc(var(--hop-height,18px) * -0.85)); }
    100% { transform:translateX(calc(-50% + var(--walk-range,80px))); }
  }
  /* wyrm additionally rocks a few degrees at each hop (rotate) for a heavy
     side-to-side waddle — on top of the stance-pause timing, this is the
     one silhouette that visibly tilts, which reptiles/lizards genuinely do
     and birds/fish don't, so it can't read as "the same arc" as the others
     even at a glance. */
  .pet-wrap.walking.walk-wyrm{ animation:walkPositionWyrm var(--walk-duration,9s) ease-in-out infinite; }
  @keyframes walkPositionWyrm{
    0%   { transform:translateX(calc(-50% + var(--walk-range,80px))) rotate(0deg); }
    12%  { transform:translateX(calc(-50% + var(--walk-range,80px))) rotate(0deg); } /* stance pause */
    40%  { transform:translateX(calc(-50% - var(--walk-range,80px) * 0.2)) translateY(calc(var(--hop-height,18px) * -1)) rotate(-5deg); }
    50%  { transform:translateX(calc(-50% - var(--walk-range,80px))) rotate(0deg); }
    62%  { transform:translateX(calc(-50% - var(--walk-range,80px))) rotate(0deg); } /* stance pause */
    90%  { transform:translateX(calc(-50% + var(--walk-range,80px) * 0.2)) translateY(calc(var(--hop-height,18px) * -1)) rotate(5deg); }
    100% { transform:translateX(calc(-50% + var(--walk-range,80px))) rotate(0deg); }
  }
  /* tide has NO vertical hop at all (unlike sky/wyrm) — a continuous flat
     glide with a gentle horizontal squash-stretch standing in for a swimming
     undulation instead, so it reads as the one style that never leaves the
     ground rather than just "a smaller hop". */
  .pet-wrap.walking.walk-tide{ animation:walkPositionTide var(--walk-duration,9s) ease-in-out infinite; }
  @keyframes walkPositionTide{
    0%   { transform:translateX(calc(-50% + var(--walk-range,80px))) scaleX(1); }
    25%  { transform:translateX(calc(-50% + var(--walk-range,80px) * 0.3)) scaleX(1.08); }
    50%  { transform:translateX(calc(-50% - var(--walk-range,80px))) scaleX(1); }
    75%  { transform:translateX(calc(-50% - var(--walk-range,80px) * 0.3)) scaleX(1.08); }
    100% { transform:translateX(calc(-50% + var(--walk-range,80px))) scaleX(1); }
  }
  .pet-wrap.walking img{ animation:petWalkFace var(--walk-duration,9s) ease-in-out infinite; }
  @keyframes petWalkFace{
    0%   { transform:scaleX(1) translateY(0); }
    49%  { transform:scaleX(1) translateY(0); }
    50%  { transform:scaleX(-1) translateY(0); }
    99%  { transform:scaleX(-1) translateY(0); }
    100% { transform:scaleX(1) translateY(0); }
  }
  /* Egg stage: no legs, so no patrol — just a gentler glow than the earlier
     attempt (this screen leans soft/muted, so a big saturation spike read
     as too loud) plus a shake once it's about halfway to hatching. */
  .pet-wrap img.egg-mystery{ animation:eggGlow 2.6s ease-in-out infinite; }
  @keyframes eggGlow{
    0%,100%{ filter:hue-rotate(20deg) saturate(1.5) brightness(1.05) drop-shadow(0 0 6px rgba(255,209,102,.35)); }
    50%{ filter:hue-rotate(20deg) saturate(1.6) brightness(1.1) drop-shadow(0 0 12px rgba(255,209,102,.5)); }
  }
  @keyframes eggShake{
    0%,100%{ transform:rotate(0deg) translateX(0); }
    20%{ transform:rotate(-4deg) translateX(-2px); }
    40%{ transform:rotate(3deg) translateX(2px); }
    60%{ transform:rotate(-3deg) translateX(-2px); }
    80%{ transform:rotate(4deg) translateX(2px); }
  }
  .pet-wrap img.egg-mystery.hatching-soon{ animation:eggGlow 2.6s ease-in-out infinite, eggShake .5s ease-in-out infinite; }
  /* Wall-crawl (Wyrmborn's Lizard stage only): pulled the anchor in from
     74%→63% and cut the range from ±85→±55 so the rightmost extreme stays
     on-screen instead of clipping past the card edge. Raised from top:50%
     to top:34% to clear the (now taller) floor/rug below. Direction-facing
     uses rotate(90deg) vs rotate(-90deg) instead of a scale flip — the
     lizard's default art has its head at the TOP of the unrotated glyph, so
     a plain 90°/-90° swap points the head at whichever side it's crawling
     toward without fighting the scaleX-based logic the floor stages use. */
  .pet-wrap.wall{ left:63%; top:34%; bottom:auto; animation:wallCrawl 7s ease-in-out infinite; }
  .pet-wrap.wall:active{ animation-play-state:paused; transform:translate(-50%,-50%) scale(.93); }
  @keyframes wallCrawl{
    0%,100%{ transform:translate(calc(-50% - 55px),-50%); }
    50%{ transform:translate(calc(-50% + 55px),-50%); }
  }
  .pet-wrap.wall img{ animation:lizardFace 7s ease-in-out infinite; }
  @keyframes lizardFace{
    0%,49%  { transform:rotate(90deg); }
    50%,99% { transform:rotate(-90deg); }
    100%    { transform:rotate(90deg); }
  }
  .pet-info-bar{
    position:absolute; left:0; right:0; bottom:0; height:44px; z-index:8; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:linear-gradient(to top, rgba(5,7,15,.6) 0%, rgba(5,7,15,.45) 60%, transparent 100%);
  }
  .pet-name-tag{ font-size:.7rem; color:var(--muted); line-height:1.3; }
  .pet-stage-tag{ font-weight:700; font-size:.8rem; line-height:1.3; }
  .warn-banner{
    position:absolute; bottom:50px; left:50%; transform:translateX(-50%); z-index:11;
    background:rgba(255,107,122,.16); border:1px solid rgba(255,107,122,.4); color:#ffc2c9;
    font-size:.66rem; padding:4px 10px; border-radius:999px; white-space:nowrap;
  }

  /* ---- Hearts (pet-tap) and Care FX (correct-answer reaction) both live
     inside #petWrap now, anchored to the pet's own image (top:50px = the
     100px image's vertical center) instead of the habitat card at large —
     so they show up ON the pet, in front of it (z-index 3, above the img's
     z-index 2), and travel with it automatically in the wall-crawl case. ---- */
  .pet-hearts{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .pet-hearts span{
    position:absolute; top:50px; font-size:1.9rem; pointer-events:none;
    animation:heartFloat 1.3s ease forwards;
  }
  @keyframes heartFloat{
    0%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(calc(-50% + var(--heart-drift,0px)),-70px); }
  }

  .care-fx{ position:absolute; inset:0; z-index:3; pointer-events:none; overflow:visible; }

  /* ---- Low-need indicators, ported from the original build (statusDizzy/
     statusSleep/statusStink), plus two new ones (statusConfused for low
     Knowledge, statusFrizz for low Grooming). All anchor off #pet-status's
     inset:0 (= #petImg's own top/left, same reasoning as the FX anchors
     above), so "top:-Npx" reads as "above the pet's head" regardless of
     which stage/species is currently shown.

     #petStatus is a *sibling* of #petWrap's other children, but it's still
     a child of #petWrap itself — so while walking, it inherits walkPosition
     wholesale, hop included: the same translateX+translateY(-hop) the pet's
     own body rides on. Each indicator's own bob/float/wiggle keyframes were
     then compositing on TOP of that already-diagonal hop arc, which is what
     read as "too diagonal" instead of a clean vertical bob. .pet-status.walking
     runs an exact opposite-sign counter-hop (same --hop-height/--walk-duration
     the pet itself uses) that cancels the parent's Y-hop via simple additive
     translation composition, leaving only the parent's horizontal pacing —
     so indicators track the pet side to side like before, but hold a flat
     baseline for their own bob/float/wiggle instead of also riding the hop. */
  .pet-status{ position:absolute; inset:0; z-index:3; pointer-events:none; }
  .pet-status.walking{ animation:statusCounterHop var(--walk-duration,9s) ease-in-out infinite; }
  @keyframes statusCounterHop{
    0%   { transform:translateY(0); }
    38%  { transform:translateY(var(--hop-height,18px)); }
    50%  { transform:translateY(0); }
    88%  { transform:translateY(var(--hop-height,18px)); }
    100% { transform:translateY(0); }
  }
  /* Per-species counter-hops, matched keyframe-for-keyframe against
     walkPositionSky/Wyrm/Tide above so indicators cancel that shape's Y-hop
     exactly instead of the generic one. */
  .pet-status.walking.walk-sky{ animation:statusCounterHopSky var(--walk-duration,9s) cubic-bezier(.34,1.56,.64,1) infinite; }
  @keyframes statusCounterHopSky{
    0%,24%,50%,74%,100%{ transform:translateY(0); }
    12%,62%{ transform:translateY(var(--hop-height,18px)); }
    38%,88%{ transform:translateY(calc(var(--hop-height,18px) * 0.85)); }
  }
  .pet-status.walking.walk-wyrm{ animation:statusCounterHopWyrm var(--walk-duration,9s) ease-in-out infinite; }
  @keyframes statusCounterHopWyrm{
    0%,12%,50%,62%,100%{ transform:translateY(0); }
    40%,90%{ transform:translateY(var(--hop-height,18px)); }
  }
  /* tide's walk (walkPositionTide above) no longer has any vertical
     component — nothing to cancel, so this is just translateY(0)
     throughout. Kept as its own rule (rather than falling through to the
     generic statusCounterHop) so switching species can't leave a stale
     hop-cancelling animation running from a previous walk-sky/walk-wyrm. */
  .pet-status.walking.walk-tide{ animation:statusCounterHopTide var(--walk-duration,9s) ease-in-out infinite; }
  @keyframes statusCounterHopTide{
    0%,100%{ transform:translateY(0); }
  }
  .status-dizzy{
    position:absolute; top:-8px; left:42%; margin-left:-10px; font-size:1.4rem;
    animation:statusDizzy 1.4s ease-in-out infinite;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  @keyframes statusDizzy{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-5px); }
  }
  /* Low Knowledge — a question mark bobbing the same way as the dizzy
     swirl, just its own lane (left:58%) and a slightly different cadence so
     the two don't move in exact lockstep when both are active at once. */
  .status-confused{
    position:absolute; top:-8px; left:58%; margin-left:-9px; font-size:1.3rem;
    animation:statusConfused 1.6s ease-in-out infinite;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  @keyframes statusConfused{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-6px); }
  }
  /* Low Grooming — a dark rain cloud looming/hovering directly overhead,
     sitting higher than the other indicators (top:-16px vs their -6/-8px)
     and centered, so it reads as "looming over" rather than sharing the
     same close-to-the-head band as dizzy/confused. A slow, small bob for a
     heavier "hovering" feel rather than dizzy's quicker bounce. */
  .status-raincloud{
    position:absolute; top:-16px; left:50%; margin-left:-11px; font-size:1.5rem;
    animation:statusRaincloud 2.4s ease-in-out infinite;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  @keyframes statusRaincloud{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }
  .status-sleep{
    position:absolute; top:-2px; animation:statusSleep 2.6s ease-in infinite;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
  }
  .status-sleep1{ left:54%; margin-left:-7px; font-size:1rem; animation-delay:0s; }
  .status-sleep2{ left:66%; margin-left:-7px; font-size:1.2rem; animation-delay:.8s; }
  @keyframes statusSleep{
    0%{ transform:translateY(6px); opacity:0; }
    20%{ opacity:.9; }
    100%{ transform:translateY(-26px); opacity:0; }
  }
  .status-stink{ position:absolute; color:#8a9a4a; animation:statusStink 2.2s ease-in-out infinite; }
  .status-stink svg{ display:block; width:12px; height:26px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  .status-stink1{ left:42%; margin-left:-5px; top:-10%; animation-delay:0s; }
  .status-stink2{ left:54%; margin-left:-5px; top:-10%; animation-delay:.25s; }
  .status-stink3{ left:36%; margin-left:-5px; top:-26%; animation-delay:.5s; }
  .status-stink4{ left:48%; margin-left:-5px; top:-26%; animation-delay:.75s; }
  @keyframes statusStink{
    0%{ transform:translateY(4px) scale(.85); opacity:0; }
    22%{ opacity:.8; }
    55%{ transform:translateY(-9px) scale(1); }
    100%{ transform:translateY(-22px) scale(1.05); opacity:0; }
  }

  @keyframes meatDrop{
    0%{ transform:translate(-10px,-40px) rotate(-15deg); opacity:0; }
    20%{ opacity:1; }
    55%{ transform:translate(0,0) rotate(5deg); opacity:1; }
    75%{ transform:translate(0,0) rotate(0deg) scale(1); opacity:1; }
    88%{ transform:translate(0,4px) rotate(-10deg) scale(.55); opacity:1; }
    100%{ transform:translate(0,4px) rotate(-10deg) scale(0); opacity:0; }
  }
  .fx-meat{ position:absolute; left:50%; top:24px; margin-left:-22px; font-size:2.2rem; animation:meatDrop 1.8s ease forwards; }

  @keyframes bubbleFloat{
    0%{ transform:translateY(0) scale(.4); opacity:0; }
    15%{ opacity:.9; }
    60%{ transform:translateY(-46px) scale(1); opacity:.9; }
    100%{ transform:translateY(-78px) scale(1.15); opacity:0; }
  }
  .fx-bubble{
    position:absolute; top:50px; width:13px; height:13px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.9) 0%, rgba(125,224,255,.6) 40%, rgba(125,224,255,.15) 75%, transparent 100%);
    border:1px solid rgba(255,255,255,.4);
    animation:bubbleFloat 1.8s ease forwards;
  }

  @keyframes shineSweep{
    0%{ background-position:-60% 0; opacity:0; }
    15%{ opacity:1; } 82%{ opacity:1; }
    100%{ background-position:160% 0; opacity:0; }
  }
  .fx-shine{
    position:absolute; left:50%; top:50px; width:100px; height:100px; margin-left:-50px; margin-top:-50px;
    border-radius:50%; mix-blend-mode:overlay;
    background:linear-gradient(75deg, transparent 30%, rgba(255,255,255,.85) 48%, transparent 66%);
    background-size:250% 250%;
    animation:shineSweep 1.6s ease forwards;
  }
  @keyframes sparklePop{
    0%{ opacity:0; transform:scale(.3) translateY(0); }
    30%{ opacity:1; transform:scale(1) translateY(-6px); }
    100%{ opacity:0; transform:scale(.6) translateY(-18px); }
  }
  .fx-spark{ position:absolute; font-size:1rem; animation:sparklePop 1.6s ease forwards; }

  /* ---- Rich pet (RICH_PET_ART) support ----
     img.rich-pet: transform-origin the motion spec assumes (bottom-center-
     ish, 50% 85%) — every other stage's CSS keyframes use plain translate/
     scale where origin doesn't matter, so this is scoped to rich-pet only.
     rich-fx-*: the spec's particle flourishes (sparkle burst on Happy,
     ground ring on Jump, tap ripple, eating morsel), restyled from its
     placeholder steel-blue to the game's own accent/gold palette. Positioned
     off #petWrap (100px img, top:50px = vertical center — same anchor
     .pet-hearts already uses) so they travel with the pet automatically. */
  .pet-wrap img.rich-pet{ transform-origin:50% 85%; }
  .rich-fx-sparkle{
    position:absolute; left:50%; top:34px; width:6px; height:6px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 6px 1px rgba(255,209,102,.7);
    animation:richSparkle .9s ease forwards;
  }
  @keyframes richSparkle{
    0%{ opacity:0; transform:translate(-50%,-50%) rotate(var(--ang)) translateY(0) scale(.4); }
    25%{ opacity:1; }
    100%{ opacity:0; transform:translate(-50%,-50%) rotate(var(--ang)) translateY(-58px) scale(1); }
  }
  .rich-fx-ring{
    position:absolute; left:50%; bottom:6px; width:40px; height:14px; margin-left:-20px;
    border-radius:50%; background:radial-gradient(ellipse at center, rgba(125,224,255,.5) 0%, transparent 72%);
    animation:richRing 1.5s ease-out forwards;
  }
  @keyframes richRing{
    0%{ opacity:0; transform:scale(.4); }
    12%{ opacity:.8; }
    66%{ opacity:.5; transform:scale(2.4); }
    100%{ opacity:0; transform:scale(2.8); }
  }
  .rich-fx-ripple{
    position:absolute; left:50%; bottom:2px; width:40px; height:14px; margin-left:-20px;
    border-radius:50%; border:2px solid var(--accent); opacity:.9;
    animation:richRipple 1.05s ease-out forwards;
  }
  @keyframes richRipple{
    0%{ opacity:.9; transform:scale(1); }
    100%{ opacity:0; transform:scale(4.5); }
  }
  @keyframes ballArc{
    0%{ transform:translate(-50px,-6px) scale(.7); opacity:0; }
    15%{ opacity:1; }
    45%{ transform:translate(-6px,-30px) scale(1); }
    65%{ transform:translate(12px,-4px) scale(1); }
    85%{ transform:translate(30px,-18px) scale(.9); }
    100%{ transform:translate(50px,6px) scale(.4); opacity:0; }
  }
  .fx-ball{ position:absolute; left:50%; top:50px; margin-left:-11px; font-size:1.3rem; animation:ballArc 2s ease-in-out forwards; }

  @keyframes swordSwipe{
    0%{ transform:translate(-34px,-24px) rotate(-40deg) scale(.8); opacity:0; }
    20%{ opacity:1; }
    45%{ transform:translate(28px,18px) rotate(20deg) scale(1.1); opacity:1; }
    60%,100%{ opacity:0; }
  }
  .fx-sword{ position:absolute; left:50%; top:24px; margin-left:-12px; font-size:1.4rem; animation:swordSwipe 1.6s ease-in-out forwards; }

  /* Room decor now renders as <image> elements INSIDE the room SVG itself
     (see #decorLayer in houseSVG/renderCosmetics) instead of separately
     positioned HTML spans — see the comment on SHOP_ITEMS' svgX/svgY/svgSize
     for why. transform-box:fill-box makes the float animation's
     translate/rotate anchor to the image's own bounding box instead of the
     SVG's origin; values are unitless (bare numbers), which CSS resolves as
     the SVG's own user-space units (viewBox units), not px — a px value
     here would translate by 8 REAL pixels regardless of how much the whole
     room is currently scaled up/down for the device, so the float distance
     would look wildly different from one screen to the next; unitless
     keeps it proportional to the room art the same way every other
     dimension in this SVG already is. */
  .decor-float{ animation:decorFloat 3.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%; }
  @keyframes decorFloat{ 0%,100%{ transform:translateY(0) rotate(-2deg);} 50%{ transform:translateY(-5) rotate(2deg);} }

  .pet-aura{
    position:absolute; left:50%; top:50px; width:110px; height:110px; transform:translate(-50%,-50%);
    border-radius:50%; z-index:1; opacity:0; transition:opacity .3s; pointer-events:none;
    background:radial-gradient(circle, var(--aura-color,transparent) 0%, transparent 70%);
    animation:auraPulse 2.6s ease-in-out infinite;
  }
  .pet-aura.active{ opacity:.55; }
  @keyframes auraPulse{ 0%,100%{ transform:translate(-50%,-50%) scale(1);} 50%{ transform:translate(-50%,-50%) scale(1.12);} }

  /* ---- Evolution: a proper celebratory beat instead of a quick scale-pop —
     a bright flash + expanding gold ring behind the pet (z-index 1, under
     the img), plus the pet itself doing a bouncier pop/wobble, plus a
     scatter of sparkles bursting outward through #careFx. ---- */
  .evolve-fx{ position:absolute; inset:0; z-index:1; pointer-events:none; overflow:visible; }
  @keyframes evolveFlash{ 0%{ opacity:0; } 18%{ opacity:1; } 100%{ opacity:0; } }
  .fx-evolve-flash{
    position:absolute; left:50%; top:50px; width:200px; height:200px; margin-left:-100px; margin-top:-100px;
    border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,209,102,.6) 35%, transparent 70%);
    animation:evolveFlash .9s ease-out forwards;
  }
  @keyframes evolveRing{
    0%{ transform:translate(-50%,-50%) scale(.3); opacity:.95; border-width:7px; }
    100%{ transform:translate(-50%,-50%) scale(3.4); opacity:0; border-width:1px; }
  }
  .fx-evolve-ring{
    position:absolute; left:50%; top:50px; width:90px; height:90px;
    border-radius:50%; border:7px solid var(--gold);
    animation:evolveRing 1.15s cubic-bezier(.2,.6,.4,1) forwards;
  }
  @keyframes evolveRing2{
    0%{ transform:translate(-50%,-50%) scale(.3); opacity:.8; border-width:5px; }
    100%{ transform:translate(-50%,-50%) scale(2.6); opacity:0; border-width:1px; }
  }
  .fx-evolve-ring2{
    position:absolute; left:50%; top:50px; width:90px; height:90px;
    border-radius:50%; border:5px solid var(--accent);
    animation:evolveRing2 1.15s cubic-bezier(.2,.6,.4,1) .15s forwards;
  }
  @keyframes evolveSparkleBurst{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(0deg); }
    25%{ opacity:1; }
    100%{ opacity:0; transform:translate(calc(-50% + var(--sx,0px)),calc(-50% + var(--sy,0px))) scale(1.1) rotate(var(--sr,90deg)); }
  }
  .fx-evolve-sparkle{
    position:absolute; left:50%; top:50px; font-size:1.3rem;
    animation:evolveSparkleBurst 1.3s ease-out forwards;
  }
  @keyframes evolveImgPop{
    0%{ transform:scale(1) rotate(0deg); }
    22%{ transform:scale(1.5) rotate(-10deg); }
    42%{ transform:scale(.82) rotate(8deg); }
    62%{ transform:scale(1.15) rotate(-4deg); }
    80%{ transform:scale(.96) rotate(2deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }
  .pet-wrap.evolve-burst img{ animation:evolveImgPop 1.9s cubic-bezier(.34,1.56,.64,1) forwards; }

  /* ============== BOTTOM PANEL ============== */
  #panel{ flex:1; min-height:0; background:var(--card); display:flex; flex-direction:column; position:relative; }
  .needs-row{ display:flex; justify-content:space-around; padding:12px 8px 6px; gap:4px; }
  .need{ display:flex; flex-direction:column; align-items:center; gap:4px; width:42px; }
  .need img{ width:19px; height:19px; }
  .need-bar{ width:34px; height:5px; border-radius:3px; background:#0f1224; overflow:hidden; }
  .need-bar i{ display:block; height:100%; transition:width .3s; }
  .need-pct{ font-size:.56rem; color:var(--muted); }

  #panelContent{ flex:1; overflow-y:auto; padding:8px 14px 4px; }
  .activity-feed{ padding-bottom:8px; }
  .activity-feed-title{ font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:10px 0 6px; }
  .activity-row{ display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:.76rem; }
  .activity-icon{ font-size:.9rem; }
  .activity-text{ flex:1; color:var(--muted); }
  .activity-xp{ color:var(--green); font-size:.7rem; font-weight:700; }
  .activity-empty{ color:var(--muted); font-size:.76rem; padding:10px 0; text-align:center; }

  .fab{
    /* Was a fixed bottom:10px, measured from #panel's true bottom edge —
       which IS #app's bottom edge (panel is the flex:1 remainder of a fixed-
       height #app). In a plain browser tab that edge sits above Safari's own
       chrome, so 10px read fine, but installed as a standalone home-screen
       app that same edge is the literal bottom of the screen: the FAB sat
       only 10px above the home-indicator gesture strip, deep inside the
       safe area instead of resting on the navbar like the icons beside it.
       Add the same safe-area-inset-bottom the navbar already accounts for
       so the FAB anchors to the navbar's visual position, not the raw
       screen edge, in both contexts. */
    /* Went 68px → 56px → back up to 62px. The fixed (non-safe-area) part of
       the bar's padding is already down at 2px, close to the floor of
       what's still comfortably tappable — there isn't much more room to
       reclaim for #panelContent by shrinking further. Past that floor, a
       too-small FAB just leaves the reserved bar-height looking sparse
       instead of actually giving that space back to the content above, so
       sized back up partway to fill it instead. */
    position:absolute; left:50%; bottom:calc(7px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:62px; height:62px;
    border-radius:50%; background:linear-gradient(160deg,var(--accent),var(--accent2)); display:flex;
    align-items:center; justify-content:center; box-shadow:0 8px 22px rgba(125,224,255,.45), 0 0 0 4px var(--card); z-index:20;
    border:none; cursor:pointer;
  }
  .fab img{ width:31px; height:31px; }

  .navbar{
    display:flex; border-top:1px solid rgba(255,255,255,.08); background:#161a35;
    /* This fixed (non-safe-area) part is at its floor — see the .fab
       comment above for why growing the icons/FAB back up a little, rather
       than shrinking this further, is the better trade past this point. */
    padding:2px 4px calc(2px + env(safe-area-inset-bottom,0px));
  }
  .navbar .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:.7rem;
    color:var(--muted); background:none; border:none; padding:3px; cursor:pointer;
  }
  .navbar .tab.active{ color:var(--accent); }
  .navbar .tab .ic{ font-size:1.4rem; }

  /* ============== QUICK-CARE SHEET (modal) ============== */

  #sheetBody{ overflow-y:auto; padding:4px 16px 24px; }

  .care-pick-grid{ display:flex; flex-direction:column; gap:8px; }

    display:flex; align-items:center; gap:12px; background:var(--card2); border:none; border-radius:12px;
    padding:12px 14px; color:var(--text); text-align:left; cursor:pointer;

  .care-pick-btn img{ width:24px; height:24px; }
  .care-pick-btn .cp-label{ flex:1; font-weight:600; font-size:.86rem; }
  .care-pick-btn .cp-pct{ font-size:.74rem; color:var(--muted); }

  .topic-tag{
    display:inline-block; font-size:.66rem; color:var(--accent); background:rgba(125,224,255,.1);
    border:1px solid rgba(125,224,255,.25); border-radius:999px; padding:3px 10px; margin-bottom:10px;
  }
  .question{ font-size:1rem; font-weight:600; margin-bottom:12px; line-height:1.4; }
  .options{ display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .opt-btn{
    background:var(--card2); border:1.5px solid transparent; border-radius:10px; padding:11px 13px;
    color:var(--text); text-align:left; font-size:.84rem; cursor:pointer; line-height:1.4;
  }
  .opt-btn.correct{ border-color:var(--green); background:rgba(110,231,168,.12); }
  .opt-btn.wrong{ border-color:var(--red); background:rgba(255,107,122,.12); }
  .opt-btn:disabled{ opacity:.75; }
  .feedback{ display:none; background:var(--card2); border-radius:12px; padding:12px 14px; font-size:.8rem; line-height:1.5; margin-bottom:12px; }
  .feedback.show{ display:block; }
  .xp-gain{ color:var(--green); font-weight:700; }
  .need-gain{ color:var(--accent); font-weight:700; }
  .bonus-note, .penalty-note{ display:block; margin-top:6px; font-size:.74rem; }
  .bonus-note{ color:var(--gold); }
  .penalty-note{ color:var(--red); }
  .next-btn{
    display:none; width:100%; background:linear-gradient(160deg,var(--accent),var(--accent2)); color:#08101f;
    font-weight:700; border:none; border-radius:10px; padding:12px; font-size:.86rem; cursor:pointer;
  }
  .next-btn.show{ display:block; }

  /* dice */
  .dice-row{ display:flex; gap:8px; justify-content:center; margin:10px 0 8px; flex-wrap:wrap; }
  .die{ width:46px; height:46px; border-radius:10px; background:var(--card2); border:2px solid transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative; }
  .die.locked{ border-color:var(--gold); }
  .die.rolling{ animation:dieRoll .3s ease; }
  @keyframes dieRoll{ 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  .die-pips{ display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); width:26px; height:26px; gap:1px; }
  .die-pip{ border-radius:50%; }
  .die-pip.lit{ background:var(--text); }
  .die-lock{ position:absolute; bottom:-6px; right:-4px; font-size:.6rem; }
  .dice-hint{ font-size:.72rem; color:var(--muted); text-align:center; margin-bottom:10px; }
  .dice-actions{ display:flex; gap:8px; margin-bottom:10px; }
  .dice-reroll-btn, .dice-stop-btn{ flex:1; border:none; border-radius:10px; padding:11px; font-size:.8rem; font-weight:600; cursor:pointer; }
  .dice-reroll-btn{ background:var(--card2); color:var(--text); }
  .dice-reroll-btn:disabled{ opacity:.4; }
  .dice-stop-btn{ background:var(--gold); color:#3a2a00; }

  /* train */
  .train-clue{ background:var(--card2); border-radius:10px; padding:12px 14px; font-size:.86rem; margin-bottom:10px; line-height:1.4; }
  .train-tiles{ font-family:var(--font-mono); font-size:1.1rem; text-align:center; letter-spacing:3px; margin-bottom:10px; }
  .train-history{ margin-bottom:8px; max-height:110px; overflow-y:auto; }
  .train-guess-row{ display:flex; justify-content:space-between; font-size:.76rem; padding:4px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .tg-hint.later{ color:var(--accent); } .tg-hint.earlier{ color:var(--gold); }
  .train-input-row{ display:flex; gap:8px; margin-bottom:8px; }
  .train-input{ flex:1; background:#0f1224; border:1px solid rgba(255,255,255,.14); border-radius:10px; padding:10px 12px; color:var(--text); font-size:.86rem; }
  .train-guess-btn{ background:var(--accent); color:#08101f; border:none; border-radius:10px; padding:0 16px; font-weight:700; cursor:pointer; }
  .train-side-actions{ display:flex; gap:8px; margin-bottom:10px; }
  .train-hint-btn, .train-giveup-btn{ flex:1; background:var(--card2); color:var(--muted); border:none; border-radius:10px; padding:9px; font-size:.72rem; cursor:pointer; }
  .train-hint-btn:disabled{ opacity:.4; }

  /* ============== ARCADE / SHOP / HOF screens ============== */
  .screen-title{ font-size:1.05rem; font-weight:700; margin:10px 0 4px; }
  .screen-hint{ font-size:.76rem; color:var(--muted); margin-bottom:14px; line-height:1.45; }
  .arcade-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .arcade-card{ background:var(--card2); border-radius:14px; padding:14px; text-align:center; }
  .arcade-card-icon{ font-size:1.8rem; }
  .arcade-card-name{ font-weight:700; font-size:.9rem; margin:6px 0 4px; }
  .arcade-card-desc{ font-size:.72rem; color:var(--muted); margin-bottom:10px; line-height:1.4; }
  .arcade-play-btn{ background:var(--accent); color:#08101f; font-weight:700; border:none; border-radius:9px; padding:9px 18px; cursor:pointer; font-size:.82rem; }
  .shard-gain{ color:var(--gold); font-weight:700; }

  .pl-built{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; min-height:20px; }
  .pl-empty{ font-size:.76rem; color:var(--muted); text-align:center; padding:10px; }
  .pl-slot{ display:flex; gap:8px; align-items:center; background:var(--card2); border-radius:9px; padding:9px 11px; font-size:.78rem; }
  .pl-num{ background:var(--accent); color:#08101f; font-weight:700; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center; font-size:.65rem; flex-shrink:0; }
  .pl-slot.pl-good{ box-shadow:inset 0 0 0 1.5px var(--green); }
  .pl-slot.pl-bad{ box-shadow:inset 0 0 0 1.5px var(--red); }
  .pl-slot.pl-wrongpos{ box-shadow:inset 0 0 0 1.5px var(--gold); }
  .pl-pool{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .pl-chip{ background:var(--card3); border:none; border-radius:8px; padding:8px 11px; color:var(--text); font-size:.76rem; cursor:pointer; }
  .pl-chip.pl-used{ opacity:.35; }
  .pipeline-hint{ font-size:.74rem; color:var(--muted); margin-bottom:10px; line-height:1.4; }

  .mm-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:12px; }
  .mm-card{ background:var(--card2); border:1.5px solid rgba(255,255,255,.08); border-radius:9px; min-height:64px; padding:6px; font-size:.66rem; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; text-align:center; line-height:1.25; }
  .mm-card.mm-flipped{ color:var(--text); }
  .mm-card.mm-matched{ opacity:.7; }

  .fw-stage{ position:relative; height:150px; background:#0f1224; border-radius:12px; overflow:hidden; margin-bottom:10px; }
  .fw-track{ position:absolute; top:0; bottom:0; width:1px; background:rgba(255,255,255,.06); }
  .fw-track-block{ left:16.6%; } .fw-track-flag{ left:50%; } .fw-track-allow{ left:83.3%; }
  .fw-scanline{ position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--accent); opacity:.4; }
  .fw-packet{
    position:absolute; top:0; left:50%; transform:translateX(-50%); width:78%; text-align:center;
    background:var(--card3); border-radius:8px; padding:8px 10px; font-size:.72rem;
    animation:fwDrop linear forwards;
  }
  @keyframes fwDrop{ from{ top:4px; } to{ top:118px; } }
  /* Resolved (a lane was picked): "animation:none" doesn't freeze the packet
     where it visually was — it just stops overriding the base rule, so the
     packet snapped straight to that rule's plain top:0 (the very top edge
     of the stage) regardless of where the drop animation had gotten to.
     Center it instead, so the feedback text is fully visible and readable. */
  .fw-packet.fw-correct{ animation:none; top:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px var(--green); }
  .fw-packet.fw-wrong{ animation:none; top:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px var(--red); }
  .fw-lanes{ display:flex; gap:7px; margin-bottom:10px; }
  .fw-lane{ flex:1; background:var(--card2); border:none; border-radius:10px; padding:11px 4px; color:var(--text); font-size:.72rem; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .fw-lane-icon{ font-size:1.1rem; }
  .fw-feedback{ font-size:.76rem; border-radius:10px; padding:10px 12px; margin-bottom:10px; line-height:1.4; }
  .fw-feedback-good{ background:rgba(110,231,168,.12); color:#c8ffe0; }
  .fw-feedback-bad{ background:rgba(255,107,122,.12); color:#ffd7db; }

  .bug-stage{ position:relative; height:90px; background:#0f1224; border-radius:12px; overflow:hidden; margin-bottom:10px; }
  .bug-crawler{
    position:absolute; top:50%; left:-40%; transform:translateY(-50%); display:flex; align-items:center; gap:6px;
    background:var(--card3); border-radius:14px; padding:8px 14px; font-size:.74rem; cursor:pointer;
    animation:bugCrawl linear forwards; max-width:82%;
  }
  /* white-space:nowrap forced every bug's full description onto one line —
     several run 60-80 characters, so the pill just grew wider than the
     (overflow:hidden) stage and the rest got clipped off, unreadable no
     matter where it sat. Left it free to wrap within max-width instead;
     min-width:0 on the text span is required for a flex child to actually
     shrink/wrap rather than keep forcing its intrinsic single-line width. */
  .bug-crawler-icon{ flex-shrink:0; }
  .bug-crawler-text{ min-width:0; overflow-wrap:break-word; }
  @keyframes bugCrawl{ from{ left:-40%; } to{ left:110%; } }
  /* Resolved (tapped or timed out): same issue as .fw-packet above —
     "animation:none" snapped back to the base rule's plain left:-40%, past
     the left edge of the (overflow:hidden) stage, instead of staying
     visible. Centered dead-center instead, matching .fw-packet's fix. */
  .bug-crawler.bug-correct{ animation:none; left:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px var(--green); }
  .bug-crawler.bug-wrong{ animation:none; left:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px var(--red); }

  .shop-section-label{ font-size:.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:14px 0 8px; }
  .shop-grid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .shop-item-card{ background:var(--card2); border-radius:12px; padding:11px; text-align:center; }
  .shop-item-card.shop-owned{ box-shadow:inset 0 0 0 1.5px rgba(110,231,168,.4); }
  .shop-item-emoji{ font-size:1.6rem; }
  .shop-item-name{ font-weight:700; font-size:.76rem; margin:5px 0 2px; }
  .shop-item-desc{ font-size:.64rem; color:var(--muted); margin-bottom:8px; line-height:1.35; min-height:2.5em; }
  .shop-action-btn{ width:100%; background:var(--accent); color:#08101f; border:none; border-radius:8px; padding:7px; font-size:.72rem; font-weight:700; cursor:pointer; }
  .shop-action-btn:disabled{ opacity:.4; }
  .shop-action-btn.shop-equipped{ background:var(--gold); }

  .debug-details{ margin:24px 0 12px; border-top:1px dashed rgba(255,255,255,.12); padding-top:14px; }
  .debug-details summary{ font-size:.76rem; color:var(--muted); cursor:pointer; }
  .debug-hint{ font-size:.68rem; color:var(--muted); margin:8px 0 10px; }
  .debug-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .debug-btn{ background:var(--card2); color:var(--text); border:1px dashed rgba(255,255,255,.15); border-radius:9px; padding:9px 6px; font-size:.7rem; cursor:pointer; }

  .hof-stat-row{ display:flex; gap:8px; margin-bottom:14px; }
  .hof-stat{ flex:1; background:var(--card2); border-radius:12px; padding:12px 8px; text-align:center; }
  .hof-stat b{ display:block; font-size:1.1rem; }
  .hof-stat span{ font-size:.64rem; color:var(--muted); }
  .badge-row{ display:flex; align-items:center; gap:9px; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05); font-size:.8rem; opacity:.4; }
  .badge-row.unlocked{ opacity:1; }
  .badge-icon{ font-size:1.1rem; }
  .legacy-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .legacy-emoji{ width:32px; height:32px; }
  .legacy-info{ flex:1; }
  .legacy-name{ font-weight:700; font-size:.82rem; }
  .legacy-meta{ font-size:.68rem; color:var(--muted); }
  .stat-topic-row{ display:flex; align-items:center; gap:8px; padding:6px 0; font-size:.74rem; }
  .stat-topic-label{ width:78px; flex-shrink:0; color:var(--muted); }
  .stat-topic-bar-outer{ flex:1; height:5px; background:#0f1224; border-radius:3px; overflow:hidden; }
  .stat-topic-bar-inner{ display:block; height:100%; background:var(--accent); }
  .stat-topic-pct{ width:32px; text-align:right; }

  /* toast */
  #toast{
    position:absolute; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); z-index:80;
    background:var(--card3); border:1px solid rgba(255,255,255,.12); border-radius:12px; padding:10px 16px;
    font-size:.8rem; opacity:0; pointer-events:none; transition:all .25s; max-width:88%; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">

  <!-- ============== SPLASH / START SCREEN ============== -->
  <div id="splashScreen">
    <div class="splash-blobs"><span></span><span></span><span></span></div>
    <div class="splash-fireflies">
      <span style="top:22%; left:20%; animation-delay:0s;"></span>
      <span style="top:34%; left:75%; animation-delay:-1.2s;"></span>
      <span style="top:60%; left:15%; animation-delay:-2.4s;"></span>
      <span style="top:68%; left:82%; animation-delay:-.6s;"></span>
      <span style="top:15%; left:55%; animation-delay:-1.8s;"></span>
      <span style="top:78%; left:40%; animation-delay:-3s;"></span>
    </div>
    <div class="splash-badge"><img src="nn-icon-512.png" alt="Neural Nest"></div>
    <h1>Neural Nest</h1>
    <p>Raise a companion. Learn a little AI security along the way.</p>
    <button id="splashStartBtn">Start</button>
  </div>

  <!-- ============== CREATION SCREEN ============== -->
  <div id="createScreen">
    <div id="createPickerView">
      <div class="create-title">Choose your companion</div>
      <div class="create-sub">Permanent once chosen — this is the one you'll raise.</div>
      <div id="bankBanner"></div>
      <div id="speciesCards"></div>
      <div class="name-field">
        <label id="nameFieldLabel">Name your companion</label>
        <input type="text" id="petNameInput" maxlength="16" placeholder="e.g. Ridge">
      </div>
      <button class="cta-btn" id="hatchBtn" disabled>Hatch →</button>
      <div class="hof-mini-link" id="hofPeekLink">View Hall of Fame</div>
    </div>
    <div id="createHofView" style="display:none;">
      <div class="create-title">🏆 Hall of Fame</div>
      <div class="create-sub" id="createHofSub"></div>
      <div id="createHofList"></div>
      <div class="hof-mini-link" id="hofBackLink">← Back to Hatch</div>
    </div>
  </div>

  <!-- ============== HOME (habitat) ============== -->
  <div id="habitatCard">
    <div id="houseSvgWrap"></div>
    <div class="hud">
      <div class="pill"><img id="hudShardIcon" src="" alt="shards"> <b id="hudShards">0</b></div>
      <button class="pill pill-btn" id="hudShopBtn"><span class="ic">🛍️</span> Shop</button>
    </div>
    <div class="pet-wrap" id="petWrap">
      <div class="pet-aura" id="petAura"></div>
      <div class="evolve-fx" id="evolveFx"></div>
      <!-- Squish (pet-tap feedback) gets its own wrapper, separate from
           #petImg. petSquish plays via a *toggled class* here, never by
           writing to an element's own .style.animation — #petImg already
           owns the walk/wall-crawl facing animation, and #petWrap owns the
           position animation; replaying an animation by touching either of
           those elements' inline style directly is exactly what caused the
           teleport-on-pet-tap bug fixed earlier this session (wrap position
           and img facing running on two independently-reset clocks). This
           wrapper carries no animation of its own except the squish, so
           there's nothing for it to clobber. -->
      <div class="pet-squish" id="petSquish"><img id="petImg" src="" alt=""></div>
      <!-- Persistent neglect indicators (dizzy/stink/zzz), ported from the
           original build's #walkerStatus — separate from #careFx (a
           one-shot animation played once right after a care answer), these
           stay up for as long as the underlying need sits below 50%, driven
           straight off state.needs and recomputed on every renderPet() call
           including the passive decay tick. -->
      <div class="pet-status" id="petStatus"></div>
      <div class="pet-hearts" id="petHearts"></div>
      <div class="care-fx" id="careFx"></div>
    </div>
    <div class="warn-banner" id="warnBanner" style="display:none;"></div>
    <!-- Thin fixed-height label strip, separate from the room art itself —
         previously the name/stage text sat directly on the floor fill, which
         (since that happened to match the panel's own color) read as one
         big flat "bar," and made the pet look like it was standing IN that
         bar instead of on the rug above it. Now it's a deliberate, short
         overlay so the room (rug included) gets the rest of the card. -->
    <div class="pet-info-bar">
      <div class="pet-name-tag" id="petNameTag"></div>
      <div class="pet-stage-tag" id="petStageTag"></div>
    </div>
  </div>

  <!-- ============== BOTTOM PANEL ============== -->
  <div id="panel">
    <div class="needs-row" id="needsRow"></div>
    <div id="panelContent">
      <div id="screenBody"><!-- arcade/shop/hof screens render here; empty on home --></div>
      <div class="activity-feed" id="homeActivityFeed">
        <div class="activity-feed-title">Recent activity</div>
        <div id="activityList"></div>
      </div>
    </div>
    <button class="fab" id="fabBtn"><img id="fabIcon" src="" alt=""></button>
    <div class="navbar">
      <button class="tab" id="navArcade"><span class="ic">🕹️</span>Arcade</button>
      <button class="tab" id="navStats"><span class="ic">📊</span>Stats</button>
    </div>
  </div>

  <!-- ============== QUICK-CARE SHEET ============== -->
  <div id="careSheet">
    <div id="careSheetInner">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <div class="sheet-title" id="sheetTitle">Care</div>
        <button class="sheet-close" id="sheetCloseBtn">✕</button>
      </div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <div id="toast"></div>
</div>
<script>
/* ============================================================
   JS ASSEMBLY MARKER — sections appended below in order:
   1. Fluent emoji  2. Species roster  3. Needs  4. Tracks (quiz banks)
   5. Term bank  6. Pipelines/Memory/Firewall/Bug data  7. Arcade games list
   8. Shop items  9. Constants  10. State/save  11. Stage helpers
   12. Creation flow  13. Retire/Hall of Fame  14. Habitat render
   15. Needs render  16. Nav/FAB  17. Quiz engine  18. Dice  19. Train
   20. Arcade game implementations  21. Shop logic  22. Hall of Fame render
   23. Init
   ============================================================ */

/* ============== 1. FLUENT EMOJI ==============
   Same technique as the old build: a hand-built map of every glyph this game
   actually uses to its Fluent asset folder/file name, rendered as <img> with
   graceful degrade back to the plain character if a URL 404s. */
const FLUENT_BASE = 'https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets';
function fluentUrl(folder, file){ return `${FLUENT_BASE}/${encodeURIComponent(folder)}/Color/${file}_color.svg`; }
const FLUENT_ICON = {
  hamburger:['Hamburger','hamburger'], soap:['Soap','soap'], sparkles:['Sparkles','sparkles'],
  tennis:['Tennis','tennis'], brain:['Brain','brain'], gem:['Gem stone','gem_stone'],
  trophy:['Trophy','trophy'], heart:['Red heart','red_heart'], house:['House','house'],
  wrench:['Wrench','wrench'], memoBrain:['Brain','brain'], shield:['Shield','shield'],
  bug:['Bug','bug'], warning:['Warning','warning'], party:['Party popper','party_popper'],
  potted_plant:['Potted plant','potted_plant'], framed_picture:['Framed picture','framed_picture'],
  books:['Books','books'], candle:['Candle','candle'], couch_lamp:['Couch and lamp','couch_and_lamp'],
  door:['Door','door'], bookmark:['Bookmark','bookmark'], sun:['Sun','sun'], sunrise:['Sunrise','sunrise'],
  crescent_moon:['Crescent moon','crescent_moon'], sparkle:['Sparkle','sparkle'],
  blue_circle:['Blue circle','blue_circle'], green_circle:['Green circle','green_circle'],
  red_circle:['Red circle','red_circle'], yellow_circle:['Yellow circle','yellow_circle'],
  purple_circle:['Purple circle','purple_circle'], high_voltage:['High voltage','high_voltage'],
  confetti:['Confetti ball','confetti_ball'], egg:['Egg','egg'],
  teddy_bear:['Teddy bear','teddy_bear'], guitar:['Guitar','guitar'],
  telescope:['Telescope','telescope'], globe_showing_americas:['Globe showing americas','globe_showing_americas'],
  balloon:['Balloon','balloon']
};
function fluentImg(key, alt, cls){
  const f = FLUENT_ICON[key];
  if(!f) return '';
  return `<img class="${cls||''}" src="${fluentUrl(f[0],f[1])}" alt="${alt||key}" loading="lazy" onerror="this.style.opacity=0;">`;
}
// Species-stage sprites use their own folder/file pairs directly (see SPECIES_LINES).
function speciesImg(stage, cls){
  // `stage` here is sometimes a raw SPECIES_LINES.stages[] entry (has .sp)
  // and sometimes getStage()'s return shape (.sp folded into .name/.emoji
  // instead) — .sp || .name covers both callers.
  const rich = RICH_PET_ART[stage.sp || stage.name];
  const src = rich ? rich.src : fluentUrl(stage.f, stage.file);
  return `<img class="${cls||''}" src="${src}" alt="${stage.sp}" loading="lazy">`;
}
/* ---- Rich pet art (Claude Design handoff, "Fluent emoji animations for
   pets" + "...pets 2") — 9 stages across all 3 evolution lines get bespoke
   local 3D PNGs plus a full hifi motion system (see richPetAnim below)
   instead of the generic Fluent-CDN glyph + shared CSS walk/idle-bob every
   other stage uses. `kind` picks which Move locomotion layer applies (see
   applyRichTransform): 'walker' = legs (fast bounce), 'swim' = fins/wings/
   hop (smooth undulation) — matches the motion spec's walkers-vs-swimmers/
   fliers split exactly. Owl isn't in either group in the 2nd handoff's
   spec (its Move is labeled "Hopping" in the State Labels table, no
   formula of its own given) — grouped with the walkers since a hop reads
   closer to the leg-cycle bounce than the smooth glide/flap undulation.
   whale.png/owl.png/eagle.png came from the same Fluent Emoji 3D set
   (MIT-licensed) as the other 6, fetched directly since the 2nd handoff's
   zip listed them in its README but didn't actually include the PNGs.
   Note: the handoff's asset is the plain "Whale" glyph (🐋), not this
   line's actual final-stage name "Spouting Whale" (🐳) — visually close
   enough (and clearly the intended pairing) to use as-is. All 9 source
   PNGs face LEFT, same convention as the rest of the roster (Owl's source
   art faces forward — spec treats it as left-facing for Move consistency,
   so it never gets the flip). */
const RICH_PET_ART = {
  'T-Rex':         { src:'pet-art/trex.png',     kind:'walker' },
  'Sauropod':      { src:'pet-art/sauropod.png', kind:'walker' },
  'Dragon':        { src:'pet-art/dragon.png',   kind:'swim' },

function defaultMeta(){

}

  try{

    if(raw) return Object.assign(defaultMeta(), JSON.parse(raw, (k,v)=> k==="__proto__" ? undefined : v));
  }catch(e){}

function defaultPetState(speciesId, name, startingShards){

      const merged = Object.assign(defaultPetState(loaded.species, loaded.name, 0), loaded);

function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }
function truncateText(s, n){ return (s && s.length > n) ? s.slice(0, n) + "…" : (s || ""); }
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}
function pickFromPool(pool){ return pool[Math.floor(Math.random()*pool.length)]; }
function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function tickNeeds(){
  if(!state) return;
  const now = Date.now();
  const hours = Math.max(0, (now - (state.lastTick || now)) / 3600000);
  if(hours > 0){
    Object.keys(state.needs).forEach(id=>{
      state.needs[id] = clamp(state.needs[id] - DECAY_PER_HOUR[id]*hours, 0, 100);
    });
  }
  state.lastTick = now;
}
function wellbeing(){
  const vals = Object.values(state.needs);
  return vals.reduce((a,b)=>a+b,0) / vals.length;
}

  if(wb >= WELLBEING_BONUS_THRESHOLD) return {label:"Thriving", cls:"thriving"};
  if(wb >= 55) return {label:"Content", cls:"content"};

  return {label:"Struggling", cls:"struggling"};
}

  const wb = wellbeing();
  if(wb < WELLBEING_PENALTY_THRESHOLD) return 0.5;
  if(wb >= WELLBEING_BONUS_THRESHOLD) return 1.2;
  return 1;
}

}
