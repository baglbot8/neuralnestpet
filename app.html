function retirePet(){
  if(getStageIndex(state.xp) !== STAGE_XP.length - 1) return; // only at max stage
  if(!confirm(`Retire ${state.name} to the Hall of Fame and start raising a new companion? You'll keep ${Math.round(RETIRE_CARRYOVER_PCT*100)}% of your Shards to help the next one along.`)) return;
  const carry = Math.floor(state.shards * RETIRE_CARRYOVER_PCT);
  meta.hallOfFame.unshift({
    name: state.name, species: state.species, stageIdx: getStageIndex(state.xp),
    shards: state.shards, ts: Date.now(),
    masteredLevels: Object.assign({}, state.masteredLevels)
  });
  meta.bankedShards += carry;
  saveMeta();
  clearPetState();
  state = null;
  renderCreateScreen();
}

/* ---- Per-pet walk cadence: every floor stage used to share one identical
   9s/80px/18px walkPosition cycle, which made every pet in the game trace
   the exact same path at the exact same speed. Each species now gets its
   own pace/stride/hop feel (birds quick and hoppy, reptiles slower and
   heavier, aquatic slower still with a shallower hop), plus a small
   deterministic per-stage jitter so the stages within one species aren't
   all in lockstep with each other either — same jitter every time for a
   given species+stage (not re-randomized per render), so a given pet's gait
   stays consistent across the session instead of twitching on every
   re-render. Read by walkPosition/petWalkFace via the --walk-duration/
   --walk-range/--hop-height custom properties set in renderPet(). ---- */
const SPECIES_MOTION = {
  sky:  { duration:7.5, range:78, hop:22 },  // birds: quick, energetic, springy hop
  wyrm: { duration:10,  range:86, hop:15 },  // reptiles: slower, heavier stride
  tide: { duration:9,   range:74, hop:12 }   // aquatic: smooth glide, shallow hop
};
function motionProfile(species, stageIdx){
  const base = SPECIES_MOTION[species] || SPECIES_MOTION.sky;
  const seed = ((species.charCodeAt(0) * 31 + stageIdx * 17) % 11) - 5; // -5..5, deterministic
  const jitter = seed / 5; // -1..1
  return {
    duration: (base.duration + jitter * 0.6).toFixed(2) + 's',
    range: Math.round(base.range + jitter * 6) + 'px',
    hop: Math.max(8, Math.round(base.hop + jitter * 3)) + 'px'
  };
}

/* ============== 13b. RICH PET ANIMATION ==============
   Full-fidelity motion engine for the 6 RICH_PET_ART stages, ported
   directly from the Claude Design handoff's motion spec ("Fluent emoji
   animations for pets" README). Six states — idle, move, jump, happy,
   eating, tap — each a self-contained 0→1 loop, computed per-frame with
   requestAnimationFrame and written straight to #petImg's transform (order
   translateX → translateY → rotate → scale, origin 50% 85%, exactly as the
   spec calls for). This completely replaces the legacy CSS walk/idle-bob/
   squish system for these 6 stages only — see the isWalking/idle-bob gating
   in renderPet() — everything else in the roster is untouched.

   Default (untriggered) behavior alternates Move laps with brief Idle
   pauses, echoing the old system's "always pacing, occasional random hop"
   feel while actually using the two states the spec defines for it. Jump/
   Happy/Eating/Tap are one-shot: triggered by playRichState(), they play
   exactly one loop then hand back control to the default cycle. */
const RICH_BOUNCE = 1; // spec's tuned-default intensity multiplier
// Duration of ONE leg (edge→middle or middle→edge — every leg covers the
// same `richRange()` distance) per locomotion kind, ms. Deliberately slower
// than the design-spec prototype's 4s/1600px full-screen sweep: this
// habitat is a ~480px-wide card, not a full-bleed frame, so covering it at
// that pace read as frantic. Paired with a bounded range (richRange(),
// below) instead of the spec's off-canvas-both-ends wrap. Half of what a
// full edge-to-edge lap used to take, since each lap is now two legs with a
// middle stop between them (see tickRichAnim) — keeps the same on-screen
// speed as before rather than quietly halving it.
const RICH_MOVE_DURATION = { walker:3250, swim:2750 };
const RICH_DURATIONS = { idle:3000, jump:2200, happy:2500, eating:3000, tap:1800 };
function easeOutElastic(x){
  const c4 = (2 * Math.PI) / 3;
  return x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * c4) + 1;
}
// x/dir track the pet's own persistent position/facing so every state reads
// from — and one-shots freeze onto — wherever it actually is, instead of
// each state defining its own (usually centered) baseline. That's what kept
// Eating/Happy/Tap from snapping the pet back to center: previously each
// one-shot's transform simply never set tx, so it defaulted to 0.
const RICH_EDGE_PAUSE = 1000;   // idle at either edge — 1s
const RICH_MIDDLE_PAUSE = 3000; // idle passing through the middle — 3s
const richAnim = {
  raf:null, kind:'walker', state:'move', stateStart:0, oneShot:false,
  x:0, dir:-1,           // dir -1 = facing/moving left (art's native facing, no flip), +1 = right (flipped)
  moveFrom:0, moveTo:0,  // this leg's start/end x, in px from center
  legTarget:'edge',      // what this leg (or the leg a one-shot interrupted) is walking TOWARD: 'edge' | 'middle'
  idleUntil:0, pauseKind:'edge' // pauseKind while state==='idle': 'edge' | 'middle' | 'settle' (post-one-shot)
};
function richRange(){
  const habitat = document.getElementById('habitatCard');
  const w = habitat ? habitat.clientWidth : 300;
  return Math.max(40, w / 2 - 70); // stays inside the card, doesn't clip the edges
}
function manageRichAnim(richDef){
  if(!richDef){ stopRichAnim(); return; }
  richAnim.kind = richDef.kind;
  if(!richAnim.raf) startRichAnim();
}
function startRichAnim(){
  richAnim.x = 0; richAnim.dir = -1;
  richAnim.state = 'move';
  richAnim.moveFrom = 0;
  richAnim.legTarget = 'edge';
  richAnim.moveTo = richAnim.dir * richRange();
  richAnim.stateStart = performance.now();
  richAnim.oneShot = false;
  richAnim.raf = requestAnimationFrame(tickRichAnim);
}
function stopRichAnim(){
  if(richAnim.raf) cancelAnimationFrame(richAnim.raf);
  richAnim.raf = null;
  const img = document.getElementById('petImg');
  if(img) img.style.transform = '';
  const wrap = document.getElementById('petWrap');
  if(wrap) wrap.style.transform = ''; // back to the plain CSS translateX(-50%)
}
// Current x this instant, mid-leg included — used to freeze a one-shot's
// position exactly where the pet is, not just wherever its last committed
// waypoint was.
function richCurrentX(now){
  if(richAnim.state !== 'move') return richAnim.x;
  const dur = RICH_MOVE_DURATION[richAnim.kind] || RICH_MOVE_DURATION.walker;
  const t = Math.min((now - richAnim.stateStart) / dur, 1);
  return richAnim.moveFrom + (richAnim.moveTo - richAnim.moveFrom) * t;
}
// Plays a one-shot state (jump/happy/eating/tap) once, then resumes the
// default idle/move wander from the same spot it interrupted — moveTo/
// legTarget are deliberately left untouched here, so "settle" (see
// tickRichAnim) picks the interrupted leg back up instead of restarting it.
// No-ops if this pet isn't currently rich-animated (e.g. tapping an egg or
// a legacy-CSS stage) or another one-shot is mid-play.
function playRichState(name){
  if(!richAnim.raf) return;
  const now = performance.now();
  richAnim.x = richCurrentX(now);
  if(richAnim.oneShot) return;
  richAnim.state = name;
  richAnim.stateStart = now;
  richAnim.oneShot = true;
  spawnRichFx(name);
}
function tickRichAnim(now){
  richAnim.raf = requestAnimationFrame(tickRichAnim);
  const img = document.getElementById('petImg');
  const wrap = document.getElementById('petWrap');
  if(!img || !wrap || !state){ return; }
  let elapsed = now - richAnim.stateStart;

  if(richAnim.state === 'move'){
    const dur = RICH_MOVE_DURATION[richAnim.kind] || RICH_MOVE_DURATION.walker;
    if(elapsed >= dur){
      richAnim.x = richAnim.moveTo;
      richAnim.state = 'idle';
      richAnim.pauseKind = richAnim.legTarget; // arrived at an edge or the middle — pause length depends on which
      richAnim.idleUntil = now + (richAnim.legTarget === 'edge' ? RICH_EDGE_PAUSE : RICH_MIDDLE_PAUSE);
      richAnim.stateStart = now;
      elapsed = 0;
    }
  } else if(richAnim.oneShot){
    const dur = RICH_DURATIONS[richAnim.state];
    if(elapsed >= dur){
      richAnim.oneShot = false;
      richAnim.state = 'idle';
      richAnim.pauseKind = 'settle'; // interrupted mid-leg — resume that SAME leg, no waypoint logic
      richAnim.idleUntil = now + 400; // brief settle, not a full edge/middle pause
      richAnim.stateStart = now;
      elapsed = 0;
    }
  } else if(richAnim.state === 'idle'){
    if(now >= richAnim.idleUntil){
      if(richAnim.pauseKind === 'edge'){
        richAnim.dir *= -1;               // turn around at the edge
        richAnim.moveFrom = richAnim.x;
        richAnim.moveTo = 0;
        richAnim.legTarget = 'middle';
      } else if(richAnim.pauseKind === 'middle'){
        richAnim.moveFrom = 0;            // keep going the same way, out to the far edge
        richAnim.moveTo = richAnim.dir * richRange();
        richAnim.legTarget = 'edge';
      } else { // 'settle' — pick the interrupted leg back up from here (moveTo/legTarget untouched since)
        richAnim.moveFrom = richAnim.x;
      }
      richAnim.state = 'move';
      richAnim.stateStart = now;
      elapsed = 0;
    }
  }
  applyRichTransform(wrap, img, elapsed);
}
function applyRichTransform(wrap, img, elapsed){
  const b = RICH_BOUNCE;
  const TAU = Math.PI * 2;
  let tx = richAnim.x, ty = 0, rot = 0, sx = 1, sy = 1;
  switch(richAnim.state){
    case 'idle': {
      // Amplitudes cut to well under half the spec's originals (14/.035/3)
      // — the middle waypoint pause is exactly one full 3s idle loop long,
      // so it was always showing the complete dip+squash at full strength,
      // which read as an exaggerated "sink" every time the pet stopped
      // in the middle of the habitat.
      const p = (elapsed % RICH_DURATIONS.idle) / RICH_DURATIONS.idle;
      const s = Math.sin(p * TAU);
      ty = -s * 6 * b; sy = 1 + s * 0.015 * b; sx = 1 - s * 0.015 * b; rot = s * 1.5 * b;
      break; // tx stays richAnim.x — idle holds position, it doesn't recenter
    }
    case 'move': {
      const dur = RICH_MOVE_DURATION[richAnim.kind] || RICH_MOVE_DURATION.walker;
      const p = Math.min(elapsed / dur, 1);
      tx = richAnim.moveFrom + (richAnim.moveTo - richAnim.moveFrom) * p;
      if(richAnim.kind === 'walker'){
        // freq=6 (the design spec's literal number) read as a frantic jog —
        // abs(sin) already doubles the visible bounce rate per cycle, so at
        // freq=6 the sprite was shaking through ~12 up/down beats per leg.
        // Halved to freq=3 and softened the amplitudes to land on a
        // casual-stroll cadence instead.
        const s = Math.sin(p * TAU * 3);
        ty = -Math.abs(s) * 10 * b; rot = s * 2.5 * b;
        sy = 1 + Math.abs(s) * 0.012 * b; sx = 1 - Math.abs(s) * 0.012 * b;
      } else {
        const s = Math.sin(p * TAU * 3);
        ty = s * 20 * b; rot = s * 8 * b; sy = 1 + s * 0.03 * b;
      }
      break;
    }
    case 'jump': {
      const p = Math.min(elapsed / RICH_DURATIONS.jump, 1);
      if(p < 0.12){
        const t = p / 0.12;
        sy = 1 - t * 0.18 * b; sx = 1 + t * 0.13 * b;
      } else if(p < 0.62){
        const t = (p - 0.12) / 0.5, s = Math.sin(t * Math.PI);
        ty = -s * 127 * b; sy = 1 + s * 0.06 * b; sx = 1 - s * 0.06 * b; rot = -s * 5 * b; // peak height cut ~33% from the spec's 190
      } else if(p < 0.78){
        const t = (p - 0.62) / 0.16, s = Math.sin(t * Math.PI);
        sy = 1 - s * 0.22 * b; sx = 1 + s * 0.16 * b;
      } else {
        const t = (p - 0.78) / 0.22, settle = Math.sin(Math.PI * (1 - t)) * (1 - t);
        sy = 1 + settle * 0.04 * b; sx = 1 - settle * 0.03 * b;
      }
      break; // tx stays richAnim.x — jumps in place, wherever that is
    }
    case 'happy': {
      const p = Math.min(elapsed / RICH_DURATIONS.happy, 1);
      const bh = Math.abs(Math.sin(p * TAU * 2));
      ty = -bh * 70 * b; sy = 1 - bh * 0.12 * b; sx = 1 + bh * 0.09 * b; rot = Math.sin(p * TAU * 2) * 6 * b;
      break;
    }
    case 'eating': {
      const p = Math.min(elapsed / RICH_DURATIONS.eating, 1);
      const chomp = Math.max(0, 1 - Math.abs((p - 0.45) / 0.12));
      ty = chomp * 34 * b; sy = 1 - chomp * 0.15 * b; sx = 1 + chomp * 0.1 * b; rot = -chomp * 4;
      break;
    }
    case 'tap': {
      const p = Math.min(elapsed / RICH_DURATIONS.tap, 1);
      const raw = easeOutElastic(Math.min(p * 2.2, 1));
      sy = 1 + (raw - 1) * 0.5 * b; sx = 1 - (raw - 1) * 0.5 * b; ty = (raw - 1) * 10;
      break;
    }
  }
  // Horizontal position moves #petWrap itself (not #petImg) — petHearts/
  // careFx/petAura are all children of #petWrap (see markup), so this is
  // what makes those effects travel WITH the pet instead of firing at a
  // fixed center point the pet may no longer be standing at. #petImg only
  // ever carries the bob/rotate/scale/facing-flip, same as it always did.
  wrap.style.transform = `translateX(calc(-50% + ${tx}px))`;
  const flip = richAnim.dir > 0 ? -1 : 1; // art faces left natively — flip only when heading right
  img.style.transform = `translate(0, ${ty}px) rotate(${rot}deg) scale(${sx * flip}, ${sy})`;
}
// Lightweight particle flourishes matching the motion spec (colors restyled
// to the game's own accent/gold palette instead of the spec's steel-blue
// placeholders). All self-remove; harmless if #petWrap has moved on. Eating
// has none of its own — the existing generic fx-meat (🍖 drop, see
// playCareFX) already covers it, so a second particle here would just be a
// duplicate morsel flying in on top of it.
function spawnRichFx(kind){
  const wrap = document.getElementById('petWrap');
  if(!wrap) return;
  if(kind === 'happy'){
    [-55, 0, 55].forEach((ang, i)=>{
      const s = document.createElement('span');
      s.className = 'rich-fx-sparkle';
      s.style.setProperty('--ang', ang + 'deg');
      s.style.animationDelay = (i * 150) + 'ms';
      wrap.appendChild(s);
      setTimeout(()=> s.remove(), 900 + i * 150);
    });
  } else if(kind === 'jump'){
    const ring = document.createElement('span');
    ring.className = 'rich-fx-ring';
    wrap.appendChild(ring);
    setTimeout(()=> ring.remove(), 1500);
  } else if(kind === 'tap'){
    const ripple = document.createElement('span');
    ripple.className = 'rich-fx-ripple';
    wrap.appendChild(ripple);
    setTimeout(()=> ripple.remove(), 1050);
  }
}

/* ============== 14. HABITAT (house scene + pet render) ==============
   One shared house interior for all 3 species. The Lizard stage of Wyrmborn
   (index 1) is the one glyph that reads as upright/bipedal rather than
   something that sits naturally on the floor — Fluent draws it standing on
   its hind legs — so it alone gets rotated 90° and anchored to the open wall
   space under the window, "crawling" left/right there instead of pacing the
   floor like every other stage of every other line. */
function houseSVG(viewKey){
  const v = WINDOW_VIEWS[viewKey] || WINDOW_VIEWS.daytime;
  return `<svg viewBox="0 0 280 200" preserveAspectRatio="xMidYMax meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#2b3162"/><stop offset="100%" stop-color="#181c3c"/>
      </linearGradient>
      <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${v.sky1}"/><stop offset="100%" stop-color="${v.sky2}"/>
      </linearGradient>
      <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd97a" stop-opacity="0.45"/><stop offset="100%" stop-color="#ffd97a" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd97a" stop-opacity="0.18"/><stop offset="100%" stop-color="#ffd97a" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="floorShade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#242a54"/><stop offset="100%" stop-color="#1c2140"/>
      </linearGradient>
      <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0c0e20" stop-opacity=".6"/>
        <stop offset="100%" stop-color="#0c0e20" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <rect x="0" y="0" width="280" height="200" fill="url(#wall)"/>
    <!-- Subtle ceiling/wall seam. The lamp cord starts at y-66 (see the lamp
         group below), well above this band — kept that way on purpose so
         the cord still reads as disappearing into an undefined ceiling
         above, with this shading only marking the seam lower down, closer
         to the room itself, rather than covering the cord's own origin
         point. -->
    <rect x="0" y="-40" width="280" height="70" fill="url(#ceiling)"/>
    <!-- Window shifted up 14 from its original y18 slot — the HUD's Shop pill
         now sits inside #app's safe-area-inset-top padding (see .hud), so it
         no longer needs this corner kept clear as low as before. -->
    <g transform="translate(0,-14)">
      <rect x="176" y="18" width="72" height="60" rx="6" fill="url(#win)"/>
      <circle cx="${v.sunCx}" cy="${v.sunCy}" r="${v.sunR}" fill="${v.sunFill}" opacity="${v.sunOp}"/>
      <rect x="176" y="18" width="72" height="60" rx="6" fill="none" stroke="#0f1224" stroke-width="4"/>
      <line x1="212" y1="18" x2="212" y2="78" stroke="#0f1224" stroke-width="3"/>
      <line x1="176" y1="48" x2="248" y2="48" stroke="#0f1224" stroke-width="3"/>
    </g>
    <!-- Shelf group: was shifted down 30 to clear the top-left HUD pill —
         trimmed to 14 for the same reason as the window above (HUD moved
         into the safe-area padding, so this corner has room to spare). -->
    <g transform="translate(0,14)">
      <rect x="18" y="34" width="58" height="6" rx="2" fill="#3a4176"/>
      <rect x="24" y="16" width="10" height="20" rx="2" fill="#7de0ff" opacity=".85"/>
      <rect x="36" y="12" width="10" height="24" rx="2" fill="#b48bff" opacity=".85"/>
      <rect x="48" y="18" width="10" height="18" rx="2" fill="#ffd166" opacity=".85"/>
      <ellipse cx="66" cy="30" rx="7" ry="9" fill="#6ee7a8" opacity=".9"/>
    </g>
    <!-- Hanging ceiling lamp: was a floor lamp on the left, but the floor
         rect below is drawn (and so painted on top of) everything below
         y=100, which permanently hid the lamp's pole/base behind it. Swapped
         for a cord-and-shade hanging from the ceiling instead. y-coords sit
         above the nominal 0-200 viewBox on purpose — that's fine, they still
         land inside the SVG element's own rendered box: the letterboxed
         empty space "meet" leaves above the room content (same trick that
         lets it read as more wall/ceiling instead of clipping), so nothing
         here is actually cut off.
         x re-centered from 126 (the midpoint of the old shelf-to-window GAP,
         which reads as off-center against the whole card since the window
         is visually heavier than the shelf) to 140 — dead center of the
         280-wide viewBox, which is what preserveAspectRatio="xMidYMax"
         horizontally centers the whole scene against, so this now lines up
         with the actual middle of the card.
         Raised another 30 on top of the earlier +16 (cord now starts at
         y-66) so it starts roughly level with the HUD row (Shard pill/Shop
         button) instead of trailing noticeably below it. -->
    <g>
      <line x1="140" y1="-66" x2="140" y2="-32" stroke="#3a4176" stroke-width="2"/>
      <circle cx="140" cy="-32" r="3" fill="#3a4176"/>
      <circle cx="140" cy="2" r="30" fill="url(#lampGlow)"/>
      <path d="M124,-32 L156,-32 L164,-12 L116,-12 Z" fill="#ffd97a" opacity=".92"/>
      <path d="M124,-32 L156,-32 L164,-12 L116,-12 Z" fill="none" stroke="#3a4176" stroke-width="1" opacity=".6"/>
    </g>
    <!-- Floor: enlarged to actually cover the width the patrol animation
         travels (pets were zig-zagging past the old, narrower rug onto the
         plain dark fill next to it) — given its own soft top-to-bottom
         gradient instead of one flat block, so even at this bigger size it
         reads as a floor receding into shadow rather than a plain dark bar.
         Its fill still ends at the same tone #panel uses, so the seam into
         the panel below stays invisible; the faint warm line at the very
         bottom is an intentional baseboard accent. -->
    <path d="M0,100 L280,100 L280,200 L0,200 Z" fill="url(#floorShade)"/>
    <rect x="0" y="197" width="280" height="1.5" fill="#ffd97a" opacity=".1"/>
    <!-- rug: big enough now to stay under the pet across its full patrol
         range, sitting under where the pet stands (pet-wrap at bottom:27%).
         All three ellipses share the same cy so the rings read as
         concentric. -->
    <ellipse cx="140" cy="145" rx="132" ry="34" fill="#262c58"/>
    <ellipse cx="140" cy="145" rx="80" ry="19" fill="url(#floorGlow)"/>
    <ellipse cx="140" cy="145" rx="68" ry="15" fill="none" stroke="#ffd166" stroke-opacity=".25" stroke-width="2"/>
    <!-- Populated by renderCosmetics() with equipped room-decor <image>
         elements, in the same viewBox coordinate space as everything above
         (see the SHOP_ITEMS comment on svgX/svgY/svgSize for why this lives
         inside the SVG instead of as CSS-positioned HTML overlays). Drawn
         last so decor items with y>100 render on top of the opaque floor
         rect instead of being painted over by it. -->
    <g id="decorLayer"></g>
    <!-- Ambient fireflies — the splash screen's floating/twinkling lights,
         brought into the habitat too (same motif, see .habitat-firefly /
         fireflyTwinkleHabitat). Plain SVG circles in viewBox coordinates
         rather than a separate HTML overlay, same reasoning as decorLayer
         above: keeps them scaling/letterboxing identically to the rest of
         the room on every device instead of needing their own per-device
         calibration. Scattered across the upper/mid room, clear of the
         floor decor and the pet's own walking lane. -->
    <g id="fireflyLayer">
      <circle class="habitat-firefly" cx="55" cy="10" r="1.7" fill="#ffd97a" style="animation-delay:0s"/>
      <circle class="habitat-firefly" cx="228" cy="100" r="1.5" fill="#ffd97a" style="animation-delay:-1.2s"/>
      <circle class="habitat-firefly" cx="140" cy="-24" r="1.6" fill="#ffd97a" style="animation-delay:-2.4s"/>
      <circle class="habitat-firefly" cx="95" cy="88" r="1.4" fill="#ffd97a" style="animation-delay:-.6s"/>
      <circle class="habitat-firefly" cx="255" cy="20" r="1.7" fill="#ffd97a" style="animation-delay:-1.8s"/>
      <circle class="habitat-firefly" cx="18" cy="95" r="1.5" fill="#ffd97a" style="animation-delay:-3s"/>
    </g>
  </svg>`;
}
function renderCosmetics(){
  const layer = document.getElementById('decorLayer');
  const equippedRoom = (state.equipped.room || []).map(id=>SHOP_ITEMS.find(x=>x.id===id)).filter(Boolean);
  layer.innerHTML = equippedRoom.map(it=>{
    const f = FLUENT_ICON[it.icon];
    if(!f) return '';
    const href = fluentUrl(f[0], f[1]);
    const cls = it.anim==='float' ? 'decor-float' : '';
    return `<image href="${href}" x="${it.svgX}" y="${it.svgY}" width="${it.svgSize}" height="${it.svgSize}" class="${cls}"/>`;
  }).join('');
  const auraEl = document.getElementById('petAura');
  const auraItem = SHOP_ITEMS.find(x=>x.id===state.equipped.aura);
  if(auraItem){ auraEl.style.setProperty('--aura-color', auraItem.color); auraEl.classList.add('active'); }
  else { auraEl.classList.remove('active'); }
}
function renderHouseScene(){
  document.getElementById('houseSvgWrap').innerHTML = houseSVG(state.equipped.background);
}
let popTimer = null;
// Evolution is the single biggest payoff moment in the game — flash + two
// expanding rings behind the pet, the pet itself doing a bouncy pop/wobble,
// and a dozen sparkles bursting outward in random directions through it.
function playEvolveFX(wrap){
  clearTimeout(popTimer);
  wrap.classList.remove('evolve-burst'); void wrap.offsetWidth; // restart if triggered again mid-animation
  wrap.classList.add('evolve-burst');

  const fxEl = document.getElementById('evolveFx');
  fxEl.innerHTML = `<div class="fx-evolve-flash"></div><div class="fx-evolve-ring"></div><div class="fx-evolve-ring2"></div>`;

  const burstEl = document.getElementById('careFx');
  const sparkles = ['✨','⭐','💫','🌟'];
  let sparkleHTML = '';
  const count = 12;
  for(let i=0;i<count;i++){
    const angle = (i / count) * Math.PI * 2 + (Math.random()*0.4 - 0.2);
    const dist = 55 + Math.random()*35;
    const sx = Math.round(Math.cos(angle)*dist);
    const sy = Math.round(Math.sin(angle)*dist);
    const sr = Math.round(Math.random()*180 - 90);
    const emoji = sparkles[i % sparkles.length];
    sparkleHTML += `<span class="fx-evolve-sparkle" style="--sx:${sx}px; --sy:${sy}px; --sr:${sr}deg; animation-delay:${(i%4)*40}ms;">${emoji}</span>`;
  }
  burstEl.innerHTML = sparkleHTML;

  popTimer = setTimeout(()=>{
    wrap.classList.remove('evolve-burst');
    fxEl.innerHTML = '';
    burstEl.innerHTML = '';
  }, 2000);
}
// A small vector squiggle (crisp at any size, unlike a flat CSS gradient
// blob) reused for all 4 "stink line" copies below — ported as-is from the
// original build.
const STINK_SVG = `<svg viewBox="0 0 12 30" xmlns="http://www.w3.org/2000/svg">
  <path d="M6,29 C10,24 2,20 6,15 C10,10 2,6 6,1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>`;
// Persistent neglect indicators — see the .pet-status CSS comment for how
// these are positioned. The original build only had hunger/hygiene/play;
// grooming (a frizzy wiggle) and knowledge (a bobbing "?", mirroring the
// dizzy swirl) round it out to all 5 needs.
function renderNeedStatus(){
  const statusEl = document.getElementById('petStatus');
  if(!statusEl || !state) return;
  let html = '';
  if(state.needs.hunger < 50){
    html += `<span class="status-dizzy" title="Hungry and dizzy">💫</span>`;
  }
  if(state.needs.knowledge < 50){
    html += `<span class="status-confused" title="Could use some training">❓</span>`;
  }
  if(state.needs.grooming < 50){
    html += `<span class="status-raincloud" title="Could use some grooming">🌧️</span>`;
  }
  if(state.needs.hygiene < 50){
    html += `
      <span class="status-stink status-stink1" title="Could use a clean">${STINK_SVG}</span>
      <span class="status-stink status-stink2" title="Could use a clean">${STINK_SVG}</span>
      <span class="status-stink status-stink3" title="Could use a clean">${STINK_SVG}</span>
      <span class="status-stink status-stink4" title="Could use a clean">${STINK_SVG}</span>
    `;
  }
  if(state.needs.play < 50){
    html += `
      <span class="status-sleep status-sleep1">💤</span>
      <span class="status-sleep status-sleep2">💤</span>
    `;
  }
  statusEl.innerHTML = html;
}
function renderPet(justEvolved){
  const stage = getStage(state.xp);
  const stageIdx = getStageIndex(state.xp);
  const isLizardWall = state.species === 'wyrm' && stageIdx === 1;

  document.getElementById('petNameTag').textContent = state.name;
  // Stage name and tier are the same word at Egg (both "Egg") — showing
  // just one instead of "Egg · Egg" reads as intentional, not a glitch.
  document.getElementById('petStageTag').textContent =
    stage.name === TIERS[stageIdx] ? stage.name : `${stage.name} · ${TIERS[stageIdx]}`;

  const richDef = RICH_PET_ART[stage.name]; // getStage()'s shape — see speciesImg's comment on the two shapes
  const petImg = document.getElementById('petImg');
  petImg.src = richDef ? richDef.src : fluentUrl(stage.f, stage.file);
  petImg.alt = stage.name;
  petImg.classList.toggle('egg-mystery', stageIdx === 0);
  petImg.classList.toggle('rich-pet', !!richDef);
  // Egg starts shaking once at least halfway to hatching — same threshold
  // the original build used for its own pre-hatch tremble.
  const nextT = nextStageThreshold(state.xp);
  const pctToNext = stageIdx === 0 ? clamp(((state.xp - stage.min) / Math.max(1, nextT - stage.min)) * 100, 0, 100) : 0;
  petImg.classList.toggle('hatching-soon', stageIdx === 0 && pctToNext >= 50);

  const wrap = document.getElementById('petWrap');
  wrap.classList.toggle('wall', isLizardWall);
  // Rich pets (see RICH_PET_ART) get their own full-fidelity JS motion
  // system (richPetAnim, below) that drives #petImg's transform directly
  // every frame, including its own screen-crossing Move — so none of the
  // legacy CSS walk/idle-bob/hop machinery should touch them at all; two
  // transform sources fighting on the same element is how pets used to end
  // up stuttering mid-stride.
  const isWalking = !richDef && stageIdx > 0 && !isLizardWall;
  wrap.classList.toggle('walking', isWalking);
  // petAura/petHearts/careFx all live inside #petWrap now (see markup), so
  // moving the pet — floor vs wall — moves all of them automatically; no
  // separate .wall class needed on each one anymore.
  const statusEl = document.getElementById('petStatus');
  // Species walk-SHAPE class (walk-sky/walk-wyrm/walk-tide — see
  // walkPositionSky/Wyrm/Tide).
  //
  // renderPet() runs on every care tap, feed, decay tick, etc. — far more
  // often than the species ever actually changes — so this used to
  // unconditionally remove() then add() the class on every single call.
  // #petWrap's OWN animation is keyed directly off that class
  // (.pet-wrap.walking.walk-wyrm{animation:...}), so even a same-value
  // remove+add made the browser drop to the .pet-wrap.walking fallback rule
  // and back, RESTARTING the position animation from 0% on every render.
  // The img's facing-flip (petWalkFace) is driven by a plain descendant
  // selector on a *different* element that's never toggled, so it kept
  // running on its own uninterrupted clock — the two drifted out of phase
  // within a few renders, and the pet started flipping to face the "wrong"
  // way well before it actually reached the far side of its walk.
  // Now only touched when the class genuinely needs to change (species
  // actually differs, or walking just turned on/off), so an unrelated
  // re-render (feeding, a decay tick) leaves the running animation alone
  // and position/facing stay in lockstep.
  const walkClass = isWalking ? ('walk-' + (SPECIES_MOTION[state.species] ? state.species : 'sky')) : null;
  if(!isWalking || !wrap.classList.contains(walkClass)){
    wrap.classList.remove('walk-sky','walk-wyrm','walk-tide');
    if(statusEl) statusEl.classList.remove('walk-sky','walk-wyrm','walk-tide');
    if(walkClass){
      wrap.classList.add(walkClass);
      if(statusEl) statusEl.classList.add(walkClass);
    }
  }
  if(isWalking){
    const mp = motionProfile(state.species, stageIdx);
    wrap.style.setProperty('--walk-duration', mp.duration);
    wrap.style.setProperty('--walk-range', mp.range);
    wrap.style.setProperty('--hop-height', mp.hop);
  }
  const squishEl = document.getElementById('petSquish');
  if(squishEl) squishEl.classList.toggle('idle-bob', !richDef && stageIdx > 0);
  // --walk-duration/--hop-height are set on #petWrap above and inherit down
  // to #petStatus (a child) automatically — custom properties inherit by
  // default — so the per-species statusCounterHop* keyframes always match
  // whatever hop this particular pet actually has, no need to set them
  // again here.
  manageRichAnim(richDef);
  if(statusEl) statusEl.classList.toggle('walking', isWalking);
  if(justEvolved){
    playEvolveFX(wrap);
    if(richDef) playRichState('happy');
  }

  const lowNeeds = NEEDS.filter(n => state.needs[n.id] < NEED_LOW);
  const warnEl = document.getElementById('warnBanner');
  if(lowNeeds.length){
    warnEl.style.display = '';
    warnEl.textContent = "⚠️ " + lowNeeds.map(n=>n.label).join(' · ') + ' low';
  } else {
    warnEl.style.display = 'none';
  }

  document.getElementById('hudShardIcon').src = fluentUrl('Gem stone','gem_stone');
  document.getElementById('hudShards').textContent = state.shards;

  renderNeeds();
  renderCosmetics();
  renderNeedStatus();
}

/* ============== 15. NEEDS ROW + ACTIVITY FEED ============== */
function renderNeeds(){
  const el = document.getElementById('needsRow');
  el.innerHTML = NEEDS.map(n=>{
    const val = Math.round(state.needs[n.id]);
    const color = val < NEED_CRITICAL ? 'var(--red)' : (val < NEED_LOW ? 'var(--red)' : (val < 60 ? 'var(--gold)' : 'var(--green)'));
    return `<div class="need">${fluentImg(n.icon, n.label)}<div class="need-bar"><i style="width:${val}%; background:${color};"></i></div><div class="need-pct">${val}%</div></div>`;
  }).join('');
}
function renderActivityFeed(){
  const el = document.getElementById('activityList');
  const log = (state && state.activityLog) || [];
  el.innerHTML = log.length === 0
    ? `<div class="activity-empty">No activity yet — tap the heart to get started!</div>`
    : log.map(e=>`<div class="activity-row"><span class="activity-icon">${e.icon}</span><span class="activity-text">${e.text}</span>${e.xp?`<span class="activity-xp">+${e.xp} XP</span>`:''}</div>`).join('');
}

/* ============== 16. NAV + FAB FLIP ==============
   Heart FAB opens quick-care while on Home. On any other screen (Arcade/
   Shop/Hall of Fame) it flips to a house icon whose job is "take me back to
   the habitat" — same button, same spot, always tells you what it'll do. */
let currentScreen = 'home'; // 'home' | 'arcade' | 'shop' | 'stats'
function setScreen(screen){
  currentScreen = screen;
  clearArcadeGameState();

function pickQuestionForNeed(needId){
  const track = TRACKS.find(t=>t.needId===needId);
  if(!track) return null;
  const qs = track.questions;
  const unmastered = qs.map((q,i)=>i).filter(i=>!state.correctSet[track.id+"-"+i]);
  const pool = unmastered.length ? unmastered : qs.map((q,i)=>i);
  const idx = pickFromPool(pool);
  return {trackId:track.id, idx, data:qs[idx]};
}
function startCareQuestion(needId){
  clearArcadeGameState();
  if(needId === 'knowledge'){ startTrainRound(); return; }
  if(needId === DICE_NEED_ID){ startDiceRound(); return; }
  const picked = pickQuestionForNeed(needId);
  if(!picked) return;
  currentQuestion = { need:needId, trackId:picked.trackId, idx:picked.idx, data:picked.data };
  currentQuestion.order = shuffleArray(picked.data.opts.map((_,i)=>i));
  answeredThisQuestion = false;
  document.getElementById('sheetTitle').textContent = NEEDS.find(n=>n.id===needId).actionLabel;

}

    wrap.appendChild(btn);
  });
  document.getElementById('nextBtn').onclick = openCareSheet;

function handleAnswer(choiceIdx, btnEl){
  if(answeredThisQuestion) return;
  answeredThisQuestion = true;
  tickNeeds();
  const q = currentQuestion.data;
  const key = currentQuestion.trackId + "-" + currentQuestion.idx;
  const isCorrect = choiceIdx === q.a;
  // Collapse down to just the correct answer, not all 4 options disabled in
  // place — keeps the sheet short so the habitat (and the care animation
  // about to play) stays visible above it instead of getting buried.
  document.querySelectorAll('.opt-btn').forEach((b,pos)=>{
    const origIdx = currentQuestion.order[pos];
    if(origIdx===q.a){ b.classList.add('correct'); b.disabled = true; }
    else { b.remove(); }
  });
  state.asked++;
  let baseXp = 0;
  if(isCorrect){
    state.correct++; state.streak++; state.bestStreak = Math.max(state.bestStreak, state.streak);
    baseXp = XP_CORRECT;
    if(state.streak>0 && state.streak % STREAK_BONUS_EVERY === 0) baseXp += STREAK_BONUS_XP;
    state.correctSet[key] = true;
  } else {
    state.streak = 0; baseXp = XP_WRONG;
    state.missCounts[key] = (state.missCounts[key] || 0) + 1;
  }
  state.answered[key] = isCorrect;
  const mult = xpMultiplier();
  const xpGain = Math.round(baseXp * mult);
  const restoreAmt = isCorrect ? RESTORE_CORRECT : RESTORE_WRONG;
  const needId = currentQuestion.need;
  state.needs[needId] = clamp(state.needs[needId] + restoreAmt, 0, 100);
  if(isCorrect) playCareFX(needId);

  const prevStageIdx = getStageIndex(state.xp);
  state.xp += xpGain;
  const newStageIdx = getStageIndex(state.xp);
  const evolved = newStageIdx > prevStageIdx;

  const track = TRACKS.find(t=>t.id===currentQuestion.trackId);
  const allMastered = track.questions.every((_,i)=> state.correctSet[track.id+"-"+i]);
  const justMastered = allMastered && !state.masteredLevels[track.id];
  if(allMastered) state.masteredLevels[track.id] = true;

  logActivity(isCorrect ? '✅' : '❌', truncateText(q.q, 46), xpGain);
  if(evolved) logActivity('✨', `Evolved into ${getStage(state.xp).name}!`, 0);
  if(justMastered) logActivity('🏅', `Badge earned: ${track.name}`, 0);

  savePetState();
  renderPet(evolved);

  const needMeta = NEEDS.find(n=>n.id===needId);
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  let extraNote = "";
  if(mult < 1) extraNote = `<span class="penalty-note">${state.name} is struggling to focus — take better care for full XP.</span>`;
  else if(mult > 1) extraNote = `<span class="bonus-note">Bonus! ${state.name} is thriving, so you earned extra XP.</span>`;
  fb.innerHTML = `<b>${isCorrect ? "✅ Correct!" : "❌ Not quite."}</b> <span class="xp-gain">+${xpGain} XP</span> &nbsp;·&nbsp; <span class="need-gain">+${restoreAmt} ${needMeta.label}</span><br><br>${q.ex}${extraNote}`;
  document.getElementById('nextBtn').classList.add('show');

  if(evolved) showToast(`✨ ${state.name} evolved into ${getStage(state.xp).name}!`);
  else if(justMastered) showToast(`🏅 Badge earned: ${track.name}!`);
}

function rollDie(){ return 1 + Math.floor(Math.random()*6); }
function diceTotal(){ return currentDice.dice.reduce((sum,d)=>sum+d.value, 0); }
function diePipPositions(value){
  const layouts = { 1:[5], 2:[1,9], 3:[1,5,9], 4:[1,3,7,9], 5:[1,3,5,7,9], 6:[1,3,4,6,7,9] };
  return layouts[value] || [5];
}
function dieFaceHTML(value){
  const active = new Set(diePipPositions(value));
  let cells = '';
  for(let i=1;i<=9;i++){ cells += `<span class="die-pip${active.has(i) ? ' lit' : ''}"></span>`; }
  return `<div class="die-pips">${cells}</div>`;

  const dice = Array.from({length:DICE_COUNT}, ()=>({ value: rollDie(), locked:false, justRolled:false }));

  if(currentDice.resolved || currentDice.pendingQuestion) return;
  if(currentDice.rerollsLeft <= 0) return;
  if(currentDice.dice.every(d=>d.locked)) return;
  const picked = pickQuestionForNeed(DICE_NEED_ID);

  if(currentDice.resolved) return;
  currentDice.resolved = true;
  const total = diceTotal();
  const beat = total >= currentDice.target;
  if(beat){
    const bonus = Math.round(DICE_BONUS_XP * xpMultiplier());
    const prevStageIdx = getStageIndex(state.xp);
    state.xp += bonus;
    const newStageIdx = getStageIndex(state.xp);
    const evolved = newStageIdx > prevStageIdx;
    logActivity('🎲', `Beat the dice target (${total} vs ${currentDice.target})`, bonus);
    if(evolved) logActivity('✨', `Evolved into ${getStage(state.xp).name}!`, 0);
    playCareFX(DICE_NEED_ID);

    if(evolved) showToast(`✨ ${state.name} evolved into ${getStage(state.xp).name}!`);
    else showToast(`🎲 Beat the target! +${bonus} bonus XP`);
  } else {
    logActivity('🎲', `Missed the dice target (${total} vs ${currentDice.target})`, 0);
    savePetState();

/* ============== 20. TRAIN: guess-the-term (Knowledge, ported) ============== */
function normalizeGuess(s){ return (s || "").toLowerCase().trim().replace(/[^a-z0-9\s-]/g, "").replace(/\s+/g, " "); }
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if(m === 0) return n; if(n === 0) return m;
  const dp = Array.from({length:m+1}, ()=> new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0] = i;
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
  return dp[m][n];
}
function isCloseEnough(guessNorm, termNorm){
  if(!guessNorm || guessNorm === termNorm) return guessNorm === termNorm;
  const dist = levenshtein(guessNorm, termNorm);
  const tolerance = termNorm.length <= 5 ? 1 : (termNorm.length <= 12 ? 2 : 3);
  return dist > 0 && dist <= tolerance;
}
function termTiles(term, revealCount){
  revealCount = revealCount || 0;
  let seen = 0;
  return term.split(" ").map(word => word.split("").map(ch => { seen++; return seen <= revealCount ? ch : "▢"; }).join("")).join("&nbsp;&nbsp;&nbsp;");
}
function pickTermForTrain(){
  const unmastered = TERM_BANK.map((_,i)=>i).filter(i=>!state.correctSet["train-"+i]);
  const pool = unmastered.length ? unmastered : TERM_BANK.map((_,i)=>i);
  const idx = pickFromPool(pool);
  return {idx, data:TERM_BANK[idx]};
}
function startTrainRound(){
  const picked = pickTermForTrain();
  if(!picked) return;
  currentQuestion = { need:'knowledge', trackId:'train', idx:picked.idx, data:picked.data, guesses:[], guessCount:0, solved:false, hintsUsed:0 };
  document.getElementById('sheetTitle').textContent = `Train ${state.name}'s Mind`;
  renderTrainUI();
}
function renderTrainUI(){
  const body = document.getElementById('sheetBody');
  const q = currentQuestion.data;
  body.innerHTML = `
    <span class="topic-tag">AI Vocabulary</span>
    <div class="question">Guess the term for this definition:</div>
    <div class="train-clue">${q.definition}</div>
    <div class="train-tiles" id="trainTiles">${termTiles(q.term)}</div>
    <div class="train-history" id="trainHistory"></div>
    <div class="train-input-row">
      <input type="text" id="trainInput" class="train-input" placeholder="Type your guess…" autocomplete="off" spellcheck="false">
      <button class="train-guess-btn" id="trainGuessBtn">Guess</button>
    </div>
    <div class="train-side-actions">
      <button class="train-hint-btn" id="trainHintBtn">💡 Reveal a letter (–2 guesses)</button>
      <button class="train-giveup-btn" id="trainGiveupBtn">🏳️ Give up</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Continue →</button>
  `;
  document.getElementById('trainGuessBtn').onclick = handleTrainGuess;
  document.getElementById('trainHintBtn').onclick = handleTrainHint;
  document.getElementById('trainGiveupBtn').onclick = handleTrainGiveUp;
  document.getElementById('nextBtn').onclick = openCareSheet;
  const input = document.getElementById('trainInput');
  input.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') handleTrainGuess(); });
  input.focus();
}
function renderTrainGuessHistory(){
  const el = document.getElementById('trainHistory');
  if(!el) return;
  el.innerHTML = currentQuestion.guesses.slice().reverse().map(g=>{
    const arrow = g.direction === 'later' ? '⬆️' : '⬇️';
    const label = g.direction === 'later' ? 'comes later in the alphabet' : 'comes earlier in the alphabet';
    return `<div class="train-guess-row"><span class="tg-word">${escapeHtml(g.text)}</span><span class="tg-hint ${g.direction}">${arrow} ${label}</span></div>`;
  }).join('');
}
function handleTrainGuess(){
  if(currentQuestion.solved) return;
  const input = document.getElementById('trainInput');
  const raw = input.value;
  if(!raw || !raw.trim()) return;
  const guessNorm = normalizeGuess(raw);
  const termNorm = normalizeGuess(currentQuestion.data.term);
  currentQuestion.guessCount++;
  const exact = guessNorm === termNorm;
  const close = !exact && isCloseEnough(guessNorm, termNorm);
  if(exact || close){ finishTrainRound(true, close); return; }
  const direction = guessNorm < termNorm ? 'later' : 'earlier';
  currentQuestion.guesses.push({text: raw.trim(), direction});
  input.value = "";
  renderTrainGuessHistory();
  input.focus();
}
function handleTrainHint(){
  if(currentQuestion.solved || currentQuestion.hintsUsed >= MAX_TRAIN_HINTS) return;
  currentQuestion.hintsUsed++;
  currentQuestion.guessCount += 2;
  const tilesEl = document.getElementById('trainTiles');
  if(tilesEl) tilesEl.innerHTML = termTiles(currentQuestion.data.term, currentQuestion.hintsUsed);
  const btn = document.getElementById('trainHintBtn');
  if(btn){
    const flatTerm = currentQuestion.data.term.replace(/\s+/g, "");
    const revealed = flatTerm.slice(0, currentQuestion.hintsUsed);
    if(currentQuestion.hintsUsed >= MAX_TRAIN_HINTS){ btn.textContent = `💡 Revealed: "${revealed}…"`; btn.disabled = true; }
    else { btn.textContent = `💡 Reveal another letter (–2 guesses)`; }
  }
  document.getElementById('trainInput').focus();
}
function handleTrainGiveUp(){ if(!currentQuestion.solved) finishTrainRound(false, false); }
function finishTrainRound(success, wasClose){
  currentQuestion.solved = true;
  tickNeeds();
  const key = "train-" + currentQuestion.idx;
  state.asked++;
  let baseXp = 0, restoreAmt = RESTORE_WRONG;
  if(success){
    const bonus = Math.max(0, 30 - (currentQuestion.guessCount - 1) * 10);
    baseXp = XP_CORRECT + bonus; restoreAmt = RESTORE_CORRECT;
    state.correct++; state.streak++; state.bestStreak = Math.max(state.bestStreak, state.streak);
    if(state.streak > 0 && state.streak % STREAK_BONUS_EVERY === 0) baseXp += STREAK_BONUS_XP;
    state.correctSet[key] = true;
  } else {
    state.streak = 0; baseXp = 0;
    state.missCounts[key] = (state.missCounts[key] || 0) + 1;
  }
  state.answered[key] = success;
  const mult = xpMultiplier();
  const xpGain = Math.round(baseXp * mult);
  state.needs.knowledge = clamp(state.needs.knowledge + restoreAmt, 0, 100);
  if(success) playCareFX('knowledge');
  const prevStageIdx = getStageIndex(state.xp);
  state.xp += xpGain;
  const newStageIdx = getStageIndex(state.xp);
  const evolved = newStageIdx > prevStageIdx;
  const allMastered = TERM_BANK.every((_,i)=> state.correctSet["train-"+i]);
  const justMastered = allMastered && !state.masteredLevels['train'];
  if(allMastered) state.masteredLevels['train'] = true;
  logActivity(success ? '⚔️' : '🏳️', currentQuestion.data.term, xpGain);
  if(evolved) logActivity('✨', `Evolved into ${getStage(state.xp).name}!`, 0);
  if(justMastered) logActivity('🏅', `Badge earned: Mind Trainer`, 0);
  savePetState();
  renderPet(evolved);
  const q = currentQuestion.data;
  const needMeta = NEEDS.find(n=>n.id==='knowledge');
  const guessBtn = document.getElementById('trainGuessBtn');
  const inputEl = document.getElementById('trainInput');
  const giveupEl = document.getElementById('trainGiveupBtn');
  const hintEl = document.getElementById('trainHintBtn');
  if(guessBtn) guessBtn.disabled = true;
  if(inputEl) inputEl.disabled = true;
  if(giveupEl) giveupEl.style.display = 'none';
  if(hintEl) hintEl.style.display = 'none';
  let headline;
  if(success && wasClose) headline = `✅ Close enough! The term was "${q.term}".`;
  else if(success) headline = `✅ Correct! It's "${q.term}".`;
  else headline = `🏳️ The term was "${q.term}".`;
  let extraNote = "";
  if(mult < 1) extraNote = `<span class="penalty-note">${state.name} is struggling to focus — take better care for full XP.</span>`;
  else if(mult > 1) extraNote = `<span class="bonus-note">Bonus! ${state.name} is thriving, so you earned extra XP.</span>`;
  const summary = success ? `Solved in ${currentQuestion.guessCount} guess${currentQuestion.guessCount === 1 ? "" : "es"}.` : `No worries — it'll come up again.`;
  const fb = document.getElementById('feedback');
  fb.classList.add('show');
  fb.innerHTML = `<b>${headline}</b> <span class="xp-gain">+${xpGain} XP</span> &nbsp;·&nbsp; <span class="need-gain">+${restoreAmt} ${needMeta.label}</span><br><br>${summary}${extraNote}`;
  document.getElementById('nextBtn').classList.add('show');
  if(evolved) showToast(`✨ ${state.name} evolved into ${getStage(state.xp).name}!`);
  else if(justMastered) showToast(`🏅 Badge earned: Mind Trainer!`);
}

function petPet(){
  const heartsEl = document.getElementById('petHearts');
  if(!heartsEl || !state) return;
  const fx = SHOP_ITEMS.find(it => it.id === state.equipped.clickfx) || DEFAULT_CLICKFX;
  const count = fx.count || 1;
  const isBubble = fx.particle === 'bubble';
  for(let i=0;i<count;i++){
    const particle = document.createElement('span');
    particle.style.position = 'absolute';
    particle.style.top = '50px';
    particle.style.fontSize = '1.9rem';
    particle.style.pointerEvents = 'none';
    particle.style.animation = 'heartFloat 1.3s ease forwards';
    if(isBubble){
      const size = 15 + Math.random()*15;
      particle.style.width = size+'px'; particle.style.height = size+'px';
      particle.style.borderRadius = '50%';
      particle.style.background = 'radial-gradient(circle at 35% 30%, rgba(255,255,255,.9), rgba(125,224,255,.35))';
      particle.style.border = '1px solid rgba(255,255,255,.5)';
    } else {
      particle.textContent = fx.emojis[Math.floor(Math.random()*fx.emojis.length)];
    }
    particle.style.left = (30 + Math.random()*40) + '%';
    particle.style.setProperty('--heart-drift', (Math.random()*30 - 15) + 'px');
    particle.style.animationDelay = (i*80) + 'ms';
    heartsEl.appendChild(particle);
    setTimeout(()=> particle.remove(), 1400 + i*80);
  }
  // Used to force-restart #petWrap's own animation here (animation:'none' then
  // ''), meant as a generic "replay a bounce on tap" trick — but #petWrap is
  // the SAME element that carries the walk/wall-crawl position animation
  // (walkPosition/wallCrawl), so every tap was restarting THAT from time 0
  // too: an instant snap back to its resting CSS position (dead center,
  // since walkPosition/wallCrawl only apply via the animation, and the
  // element's own non-animated transform is translateX(-50%)) before
  // launching a fresh cycle. Worse, the pet's <img> runs its OWN separate
  // facing animation (petWalkFace/lizardFace) that was never reset by this,
  // so wrap position and img facing fell out of sync after any pet-tap —
  // the wrap restarting fresh while the img kept ticking on its old clock —
  // which is what made pets appear to face the wrong way mid-walk
  // afterward. Nothing here actually depended on restarting it (the heart
  // particles above already get a fresh inline animation each time), so the
  // restart is just removed.
  if(richAnim.raf){
    // Rich pets get the spec's elastic tap-boing instead of the legacy
    // petSquish class (see richPetAnim) — petPet() itself still runs
    // unconditionally above for the heart/click-fx particles either way.
    playRichState('tap');
  } else {
    const squishEl = document.getElementById('petSquish');
    if(squishEl){
      squishEl.classList.remove('squish-active'); void squishEl.offsetWidth; // restart if tapped again mid-squish
      squishEl.classList.add('squish-active');
    }
  }
}

/* ---- Build the Pipeline (ported) ---- */
function findPipelineItem(id){ return currentPipeline.pool.find(it=>it.id===id); }
function togglePipelineItem(id){
  if(currentPipeline.resolved) return;
  const pos = currentPipeline.placed.indexOf(id);
  if(pos >= 0) currentPipeline.placed.splice(pos, 1); else currentPipeline.placed.push(id);
  renderPipelineUI();
}
function startPipelineRound(){
  const scenarioIdx = Math.floor(Math.random()*PIPELINES.length);
  const scenario = PIPELINES[scenarioIdx];
  const items = scenario.steps.map((text,i)=> ({ id:'s'+i, text, isDecoy:false, correctPos:i }));
  scenario.decoys.forEach((d,i)=> items.push({ id:'d'+i, text:d.text, isDecoy:true, why:d.why }));
  currentPipeline = { scenarioIdx, pool: shuffleArray(items), placed: [], resolved:false };
  renderPipelineUI();
}
function renderPipelineUI(){
  const scenario = PIPELINES[currentPipeline.scenarioIdx];
  const body = document.getElementById('screenBody');
  const placedHTML = currentPipeline.placed.length ? currentPipeline.placed.map((id,i)=>{
    const item = findPipelineItem(id);
    let cls = "pl-slot";
    if(currentPipeline.resolved){
      if(item.isDecoy) cls += " pl-bad";
      else if(item.correctPos === i) cls += " pl-good";
      else cls += " pl-wrongpos";
    }
    return `<div class="${cls}" data-id="${id}"><span class="pl-num">${i+1}</span><span class="pl-text">${item.text}</span></div>`;
  }).join('') : `<div class="pl-empty">Tap steps below to build your pipeline, in order.</div>`;
  const poolHTML = currentPipeline.pool.map(item=>{
    const isPlaced = currentPipeline.placed.includes(item.id);
    return `<button class="pl-chip${isPlaced ? ' pl-used' : ''}" data-id="${item.id}" ${currentPipeline.resolved ? 'disabled' : ''}>${item.text}</button>`;
  }).join('');
  let resultHTML = '';
  if(currentPipeline.resolved){
    const missed = scenario.steps.filter((t,i)=> !currentPipeline.placed.includes('s'+i));
    resultHTML = `
      <div class="feedback show"><b>${currentPipeline.success ? "✅ Correct sequence!" : "❌ Not quite right."}</b>
      <span class="shard-gain">+${currentPipeline.shardGain} Shards</span><br><br>${currentPipeline.explainHTML}
      ${missed.length ? `<br><br><b>Steps you left out:</b> ${missed.join(', ')}` : ''}</div>
      <button class="next-btn show" id="pipelineNextBtn">← Back to Arcade</button>`;
  }
  body.innerHTML = `
    <span class="topic-tag">🔧 Build the Pipeline</span>
    <div class="question">${scenario.name}</div>
    <div class="pipeline-hint">Tap the steps below in the order they belong. A couple of these don't belong at all — leave those out.</div>
    <div class="pl-built">${placedHTML}</div>
    <div class="pl-pool">${poolHTML}</div>
    ${currentPipeline.resolved ? '' : `<button class="next-btn show" id="pipelineSubmitBtn" ${currentPipeline.placed.length===0 ? 'disabled' : ''}>Run Pipeline ▶</button>`}
    ${resultHTML}
  `;
  if(!currentPipeline.resolved){
    body.querySelectorAll('.pl-pool .pl-chip').forEach(btn=>{ btn.onclick = ()=> togglePipelineItem(btn.dataset.id); });
    body.querySelectorAll('.pl-built .pl-slot').forEach(el=>{ el.onclick = ()=> togglePipelineItem(el.dataset.id); });
    const submitBtn = document.getElementById('pipelineSubmitBtn');
    if(submitBtn) submitBtn.onclick = submitPipeline;
  } else {
    document.getElementById('pipelineNextBtn').onclick = renderArcade;
  }
}
function submitPipeline(){
  if(currentPipeline.resolved) return;
  const scenario = PIPELINES[currentPipeline.scenarioIdx];
  const key = "pipeline-" + currentPipeline.scenarioIdx;
  const placedItems = currentPipeline.placed.map(id=>findPipelineItem(id));
  const includesDecoy = placedItems.some(it=>it.isDecoy);
  const inOrder = !includesDecoy && placedItems.length === scenario.steps.length && placedItems.every((it,i)=> it.correctPos === i);
  currentPipeline.resolved = true;
  currentPipeline.success = inOrder;
  if(inOrder){
    currentPipeline.explainHTML = "Every step in the right order, and no shortcuts snuck in — that's exactly how this should go.";
  } else if(includesDecoy){
    currentPipeline.explainHTML = placedItems.filter(it=>it.isDecoy).map(it=>`<b>🚫 ${it.text}:</b> ${it.why}`).join('<br>');
  } else {
    const outOfOrder = placedItems.filter((it,i)=> it.correctPos !== i);
    currentPipeline.explainHTML = outOfOrder.length
      ? `Close, but the order matters here — ${outOfOrder.map(it=>`"${it.text}"`).join(', ')} landed in the wrong spot.`
      : "You left out some steps this pipeline actually needs.";
  }
  if(inOrder) state.correctSet[key] = true; else state.missCounts[key] = (state.missCounts[key] || 0) + 1;
  state.answered[key] = inOrder;
  currentPipeline.shardGain = inOrder ? PIPELINE_SHARD_WIN : PIPELINE_SHARD_LOSS;
  state.shards += currentPipeline.shardGain;
  logActivity(inOrder ? '✅' : '❌', `Build the Pipeline: ${scenario.name}`, 0);
  logActivity('💎', `+${currentPipeline.shardGain} Shards earned`, 0);
  savePetState();
  renderShardBalance();
  renderPipelineUI();
}

/* ---- Memory Match (ported) ---- */
function startMemoryRound(){
  const pairs = shuffleArray(MEMORY_PAIRS.map((p,i)=>i)).slice(0, MEMORY_PAIRS_PER_ROUND);
  const cards = [];
  pairs.forEach((pairId,i)=>{
    const p = MEMORY_PAIRS[pairId];
    const color = MEMORY_COLORS[i % MEMORY_COLORS.length];
    cards.push({ id:'a'+pairId, pairId, text:p.attack, color, flipped:false, matched:false });
    cards.push({ id:'f'+pairId, pairId, text:p.fix,    color, flipped:false, matched:false });
  });
  currentMemory = { cards: shuffleArray(cards), flippedIds: [], matchedCount: 0, totalPairs: pairs.length, mistakes: 0, locked: false };
  renderMemoryUI();
}
function flipMemoryCard(id){
  if(currentMemory.locked) return;
  const card = currentMemory.cards.find(c=>c.id===id);
  if(!card || card.flipped || card.matched) return;
  card.flipped = true;
  currentMemory.flippedIds.push(id);
  renderMemoryUI();
  if(currentMemory.flippedIds.length === 2){
    currentMemory.locked = true;
    const [id1, id2] = currentMemory.flippedIds;
    const c1 = currentMemory.cards.find(c=>c.id===id1);
    const c2 = currentMemory.cards.find(c=>c.id===id2);
    const isMatch = c1.pairId === c2.pairId;
    currentMemory.flipTimer = setTimeout(()=>{
      if(!currentMemory) return;
      if(isMatch){
        c1.matched = true; c2.matched = true;
        currentMemory.matchedCount++;
        const pair = MEMORY_PAIRS[c1.pairId];
        logActivity('🧠', `${pair.attack} → ${pair.fix}`, 0);
        savePetState();
      } else { c1.flipped = false; c2.flipped = false; currentMemory.mistakes++; }
      currentMemory.flippedIds = [];
      currentMemory.locked = false;
      if(currentMemory.matchedCount === currentMemory.totalPairs){
        state.shards += MEMORY_SHARD_WIN;
        logActivity('💎', `Memory Match complete — +${MEMORY_SHARD_WIN} Shards (${currentMemory.mistakes} misses)`, 0);
        savePetState();
        renderShardBalance();
      }
      renderMemoryUI();
    }, 900);
  }
}
function renderMemoryUI(){
  const body = document.getElementById('screenBody');
  const done = currentMemory.matchedCount === currentMemory.totalPairs;
  const cardsHTML = currentMemory.cards.map(c=>{
    const show = c.flipped || c.matched;
    const cls = "mm-card" + (c.matched ? " mm-matched" : "") + (show ? " mm-flipped" : "");
    const style = show ? `style="border-color:${c.color}; color:${c.color}; ${c.matched ? `background:${c.color}22;` : ''}"` : '';
    return `<button class="${cls}" data-id="${c.id}" ${style}>${show ? c.text : '🧠'}</button>`;
  }).join('');
  const resultHTML = done ? `
    <div class="feedback show"><b>✅ All matched!</b> <span class="shard-gain">+${MEMORY_SHARD_WIN} Shards</span>
    <br><br>Solved with ${currentMemory.mistakes} mismatch${currentMemory.mistakes === 1 ? '' : 'es'} along the way.</div>
    <button class="next-btn show" id="memoryNextBtn">← Back to Arcade</button>` : '';
  body.innerHTML = `
    <span class="topic-tag">🧠 Memory Match</span>
    <div class="question">Match each attack to its fix</div>
    <div class="pipeline-hint">Flip two cards at a time. Pair every attack with its correct defense.</div>
    <div class="mm-grid">${cardsHTML}</div>
    ${resultHTML}
  `;
  if(!done){ body.querySelectorAll('.mm-card').forEach(btn=>{ btn.onclick = ()=> flipMemoryCard(btn.dataset.id); }); }
  else { document.getElementById('memoryNextBtn').onclick = renderArcade; }
}

/* ---- Firewall Lanes (ported) ---- */
function firewallLaneLabel(laneId){ const l = FIREWALL_LANES.find(x=>x.id===laneId); return l ? `${l.icon} ${l.label}` : laneId; }
function startFirewallRound(){
  const queue = shuffleArray(FIREWALL_ITEMS.map((it,i)=>i)).slice(0, FIREWALL_ROUND_SIZE);
  currentFirewall = { queue, idx:0, correctCount:0, phase:'falling', feedback:null, dropTimer:null };
  showFirewallItem();
}
function showFirewallItem(){
  clearTimeout(currentFirewall.dropTimer);
  currentFirewall.phase = 'falling'; currentFirewall.feedback = null;
  renderFirewallUI();
  currentFirewall.dropTimer = setTimeout(()=> resolveFirewallPick(null), FIREWALL_DROP_MS);
}
function resolveFirewallPick(pickedLane){
  if(!currentFirewall || currentFirewall.phase !== 'falling') return;
  clearTimeout(currentFirewall.dropTimer);
  const item = FIREWALL_ITEMS[currentFirewall.queue[currentFirewall.idx]];
  const correct = pickedLane === item.lane;
  if(correct) currentFirewall.correctCount++;
  currentFirewall.phase = 'feedback';
  currentFirewall.feedback = { correct, picked: pickedLane, item };
  renderFirewallUI();
  setTimeout(()=>{
    if(!currentFirewall) return;
    currentFirewall.idx++;
    if(currentFirewall.idx >= currentFirewall.queue.length) finishFirewallRound();
    else showFirewallItem();
  }, correct ? 1000 : 1500);
}
function finishFirewallRound(){
  currentFirewall.phase = 'done';
  const shardGain = currentFirewall.correctCount * FIREWALL_SHARD_PER_CORRECT;
  currentFirewall.shardGain = shardGain;
  state.shards += shardGain;
  logActivity('🛡️', `Firewall Lanes: ${currentFirewall.correctCount}/${currentFirewall.queue.length} correct`, 0);
  logActivity('💎', `+${shardGain} Shards earned`, 0);
  savePetState();
  renderShardBalance();
  renderFirewallUI();
}
function renderFirewallUI(){

    document.getElementById('firewallNextBtn').onclick = renderArcade;

  }
  const item = FIREWALL_ITEMS[currentFirewall.queue[currentFirewall.idx]];
  const fb = currentFirewall.feedback;

  if(fb) packetCls += fb.correct ? ' fw-correct' : ' fw-wrong';
  else packetStyle = `style="animation-duration:${FIREWALL_DROP_MS/1000}s;"`;
  const laneButtons = FIREWALL_LANES.map(l=>`
    <button class="fw-lane fw-lane-${l.id}" data-lane="${l.id}" ${fb ? 'disabled' : ''}>
      <span class="fw-lane-icon">${l.icon}</span><span>${l.label}</span></button>`).join('');
  let feedbackHTML = '';
  if(fb){
    const headline = fb.picked === null
      ? `<b>⏱️ Missed it</b> — that one should've been ${firewallLaneLabel(item.lane)}.`
      : fb.correct ? `<b>✅ Correct</b> — that's ${firewallLaneLabel(item.lane)}.`
        : `<b>❌ Not quite</b> — that one should've been ${firewallLaneLabel(item.lane)}.`;
    feedbackHTML = `<div class="fw-feedback ${fb.correct ? 'fw-feedback-good' : 'fw-feedback-bad'}">${headline}${item.why ? `<br>${item.why}` : ''}</div>`;

  body.innerHTML = `
    <span class="topic-tag">🛡️ Firewall Lanes</span>

    <div class="fw-stage">
      <div class="fw-track fw-track-block"></div><div class="fw-track fw-track-flag"></div><div class="fw-track fw-track-allow"></div>
      <div class="fw-scanline"></div>
      <div class="${packetCls}" ${packetStyle}>${item.text}</div>

    ${feedbackHTML}

  `;
  if(!fb){ body.querySelectorAll('.fw-lane').forEach(btn=>{ btn.onclick = ()=> resolveFirewallPick(btn.dataset.lane); }); }
}

  const item = BUG_ITEMS[currentBugs.queue[currentBugs.idx]];
  const fb = currentBugs.feedback;
  let crawlerCls = 'bug-crawler'; let crawlerStyle = '';
  if(fb) crawlerCls += fb.correct ? ' bug-correct' : ' bug-wrong';
  else crawlerStyle = `style="animation-duration:${BUG_CRAWL_MS/1000}s;"`;
  let feedbackHTML = '';
  if(fb){
    const headline = !fb.tapped && item.critical ? `<b>❌ It got away</b> — that one was dangerous.`
      : fb.tapped && !item.critical ? `<b>❌ Oops</b> — that one was actually harmless.`
      : fb.tapped ? `<b>✅ Squashed!</b> Good catch — that one was dangerous.`
      : `<b>✅ Correctly left alone</b> — that one was harmless.`;
    feedbackHTML = `<div class="fw-feedback ${fb.correct ? 'fw-feedback-good' : 'fw-feedback-bad'}">${headline}${item.why ? `<br>${item.why}` : ''}</div>`;
  }
  body.innerHTML = `
    <span class="topic-tag">🐛 Bug Squash</span>
    <div class="pipeline-hint">Finding ${currentBugs.idx+1} of ${currentBugs.queue.length} — tap only the dangerous ones. Let the harmless ones crawl by.</div>
    <div class="bug-stage"><div class="${crawlerCls}" ${crawlerStyle}><span class="bug-crawler-icon">🐛</span><span class="bug-crawler-text">${item.text}</span></div></div>
    ${feedbackHTML}
  `;
  if(!fb){ const c = body.querySelector('.bug-crawler'); if(c) c.onclick = ()=> resolveBugPick(true); }
}

/* ============== SHOP ============== */
function isItemEquipped(it){ return it.slot === 'room' ? state.equipped.room.includes(it.id) : state.equipped[it.slot] === it.id; }
function renderShop(){
  const body = document.getElementById('screenBody');
  const sectionsHTML = SHOP_SECTIONS.map(section=>{
    const itemsHTML = SHOP_ITEMS.filter(it=>it.slot===section.slot).map(it=>{
      const owned = state.inventory.includes(it.id);
      const eq = isItemEquipped(it);
      const actionHTML = !owned
        ? `<button class="shop-action-btn" data-buy="${it.id}" ${state.shards >= it.price ? '' : 'disabled'}>Buy · ${it.price} 💎</button>`
        : `<button class="shop-action-btn ${eq ? 'shop-equipped' : ''}" data-toggle="${it.id}">${eq ? 'Unequip' : 'Equip'}</button>`;
      return `<div class="shop-item-card${owned ? ' shop-owned' : ''}">
        ${fluentImg(it.icon, it.name, 'shop-item-emoji')}
        <div class="shop-item-name">${it.name}</div>
        <div class="shop-item-desc">${it.desc}</div>
        ${actionHTML}</div>`;
    }).join('');
    return `<div class="shop-section-label">${section.label}</div><div class="shop-grid">${itemsHTML}</div>`;
  }).join('');
  body.innerHTML = `
    <div class="screen-title">🛍️ Shop</div>
    <div class="screen-hint">Spend Shards earned in the Arcade on decor for the room and effects for ${state.name}. Buy once, equip or unequip anytime for free.</div>
    ${sectionsHTML}
  `;
  body.querySelectorAll('[data-buy]').forEach(btn=>{ btn.onclick = ()=> buyItem(btn.dataset.buy); });
  body.querySelectorAll('[data-toggle]').forEach(btn=>{ btn.onclick = ()=> toggleEquip(btn.dataset.toggle); });
}
function buyItem(id){
  const item = SHOP_ITEMS.find(it=>it.id===id);
  if(!item || state.inventory.includes(id) || state.shards < item.price) return;
  state.shards -= item.price;
  state.inventory.push(id);
  if(item.slot === 'room') state.equipped.room.push(id);
  else state.equipped[item.slot] = id;
  logActivity('🛍️', `Bought ${item.name}`, 0);
  savePetState();
  renderShardBalance();
  if(item.slot === 'background') renderHouseScene();
  renderCosmetics();
}
function toggleEquip(id){
  const item = SHOP_ITEMS.find(it=>it.id===id);
  if(!item || !state.inventory.includes(id)) return;
  if(item.slot === 'room'){
    const pos = state.equipped.room.indexOf(id);
    if(pos >= 0) state.equipped.room.splice(pos, 1); else state.equipped.room.push(id);
  } else {
    state.equipped[item.slot] = (state.equipped[item.slot] === id) ? null : id;
  }
  savePetState();
  if(item.slot === 'background') renderHouseScene();
  renderCosmetics();
  renderShop();
}

/* ============== HALL OF FAME ============== */
function lookupQuestionLabel(key){
  if(key.indexOf('train-') === 0){ const t = TERM_BANK[parseInt(key.slice(6),10)]; return t ? t.term : key; }
  if(key.indexOf('pipeline-') === 0){ const p = PIPELINES[parseInt(key.slice(9),10)]; return p ? `Build the Pipeline: ${p.name}` : key; }
  const dashIdx = key.lastIndexOf('-');
  const trackId = key.slice(0, dashIdx);
  const idx = parseInt(key.slice(dashIdx + 1), 10);
  const track = TRACKS.find(t=>t.id===trackId);
  return (track && track.questions[idx]) ? track.questions[idx].q : key;
}
function renderStats(){
  const body = document.getElementById('screenBody');
  const overallAcc = state.asked > 0 ? Math.round((state.correct / state.asked) * 100) : 0;
  const stageIdx = getStageIndex(state.xp);
  const isMax = stageIdx === STAGE_XP.length - 1;

  const badgeRows = TRACKS.map(t=>{
    const unlocked = !!state.masteredLevels[t.id];
    return `<div class="badge-row${unlocked?' unlocked':''}"><span class="badge-icon">${t.badgeIcon}</span><span>${t.name}${unlocked?'':' (locked)'}</span></div>`;
  }).join('') + (()=>{ const u = !!state.masteredLevels['train']; return `<div class="badge-row${u?' unlocked':''}"><span class="badge-icon">⚔️</span><span>Mind Trainer${u?'':' (locked)'}</span></div>`; })();

  const missed = Object.entries(state.missCounts || {}).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const missedHTML = missed.length ? missed.map(([key,count])=>`<div class="legacy-row"><div class="legacy-info"><div class="legacy-name">${truncateText(lookupQuestionLabel(key),40)}</div></div><span class="legacy-meta">missed ${count}×</span></div>`).join('')
    : `<div class="activity-empty">No misses yet — keep it up!</div>`;

  const retireBtn = isMax
    ? `<button class="cta-btn" id="retireBtn" style="margin-bottom:16px;">🏆 Retire ${state.name} to the Hall of Fame</button>
       <div class="screen-hint" style="margin-top:-8px;">${state.name} has reached its final form. Retiring keeps ${Math.round(RETIRE_CARRYOVER_PCT*100)}% of your Shards for the next companion and starts a fresh Hatch.</div>`
    : '';

  const hofRows = meta.hallOfFame.length ? meta.hallOfFame.map(e=>{
    const line = speciesById(e.species);
    const stage = line.stages[e.stageIdx];
    return `<div class="legacy-row">${speciesImg(stage,'legacy-emoji')}<div class="legacy-info"><div class="legacy-name">${escapeHtml(e.name)}</div><div class="legacy-meta">${line.name} · ${stage.sp} · ${e.shards} Shards</div></div></div>`;
  }).join('') : `<div class="activity-empty">No retired companions yet.</div>`;

  body.innerHTML = `
    <div class="screen-title">📊 Stats</div>
    <div class="hof-stat-row">
      <div class="hof-stat"><b>${overallAcc}%</b><span>Accuracy</span></div>
      <div class="hof-stat"><b>${state.correct}/${state.asked}</b><span>Correct</span></div>
      <div class="hof-stat"><b>${state.bestStreak}</b><span>Best streak</span></div>
    </div>
    ${retireBtn}
    <div class="shop-section-label">Badges</div>
    ${badgeRows}
    <div class="shop-section-label">Most missed</div>
    ${missedHTML}
    <div class="shop-section-label">Retired companions (${meta.hallOfFame.length})</div>
    ${hofRows}

    <details class="debug-details">
      <summary>🛠️ Test tools</summary>
      <div class="debug-hint">For you, not players — jump around instead of grinding for real.</div>
      <div class="debug-grid">
        <button class="debug-btn" id="dbgPrevStage">⬅️ Prev stage</button>
        <button class="debug-btn" id="dbgNextStage">➡️ Next stage</button>
        <button class="debug-btn" id="dbgCycleSpecies">🔀 Cycle species</button>
        <button class="debug-btn" id="dbgHatchSoon">🥚 Preview hatch-shake</button>
        <button class="debug-btn" id="dbgShards">+300 💎 Shards</button>
        <button class="debug-btn" id="dbgNeedsLow">⚠️ Drop needs to 20%</button>
        <button class="debug-btn" id="dbgNeedsFull">💯 Fill needs to 100%</button>
      </div>
    </details>
  `;
  const rb = document.getElementById('retireBtn');
  if(rb) rb.onclick = retirePet;
  wireDebugTools();
}

/* ---- Test tools (Stats screen only) — jump stages/currency/needs directly
   instead of grinding for real, so play-testing changes doesn't take forever. ---- */
function debugSetStage(idx){
  idx = clamp(idx, 0, STAGE_XP.length - 1);
  state.xp = STAGE_XP[idx];
  savePetState();
  renderPet(false);
  renderStats();
}
// Prev/Next stage already cycles through one species' 6 stages — this cycles
// the species itself (keeping the current stage index, e.g. Owl -> Snake ->
// Dolphin -> Owl), the fastest way to preview every pet in the roster
// without re-hatching. Permanently changes which line this save's pet is
// (same as the one-time choice at creation), so it's tucked in Test tools
// on purpose, not exposed anywhere a player would stumble into it.
function debugCycleSpecies(){
  const idx = SPECIES_LINES.findIndex(s=>s.id===state.species);
  const next = SPECIES_LINES[(idx + 1) % SPECIES_LINES.length];
  state.species = next.id;
  savePetState();
  renderPet(false);
  renderStats();
}
function wireDebugTools(){
  const prevBtn = document.getElementById('dbgPrevStage');
  const nextBtn = document.getElementById('dbgNextStage');
  const speciesBtn = document.getElementById('dbgCycleSpecies');
  const hatchBtn = document.getElementById('dbgHatchSoon');
  const shardsBtn = document.getElementById('dbgShards');
  const lowBtn = document.getElementById('dbgNeedsLow');
  const fullBtn = document.getElementById('dbgNeedsFull');
  if(prevBtn) prevBtn.onclick = ()=> debugSetStage(getStageIndex(state.xp) - 1);
  if(nextBtn) nextBtn.onclick = ()=> debugSetStage(getStageIndex(state.xp) + 1);
  if(speciesBtn) speciesBtn.onclick = debugCycleSpecies;
  if(hatchBtn) hatchBtn.onclick = ()=>{
    state.xp = Math.round(STAGE_XP[0] + (STAGE_XP[1] - STAGE_XP[0]) * 0.6);
    savePetState(); renderPet(false); renderStats();
  };
  if(shardsBtn) shardsBtn.onclick = ()=>{ state.shards += 300; savePetState(); renderShardBalance(); };
  if(lowBtn) lowBtn.onclick = ()=>{
    Object.keys(state.needs).forEach(id=> state.needs[id] = 20);
    savePetState(); renderPet(false);
  };
  if(fullBtn) fullBtn.onclick = ()=>{
    Object.keys(state.needs).forEach(id=> state.needs[id] = 100);
    savePetState(); renderPet(false);
  };
}

/* ---- Occasional random hop — the "energetic, unique" idle motion asked for
   on top of the always-on idle-bob: every few seconds, a chance at one bigger
   bouncy hop on #petSquish (see .big-hop/petBigHop above). A single
   self-rescheduling setTimeout (not a setInterval re-armed on every
   renderPet call) so there's exactly one timer alive for the whole session,
   regardless of how many times the pet re-renders. Purely cosmetic — reads
   state but never writes it — so it's safe to just let it run continuously
   in the background even while another screen is showing. ---- */
let petHopTimer = null;
function scheduleRandomHop(){
  clearTimeout(petHopTimer);
  const delay = 4000 + Math.random()*6000; // next attempt in 4-10s
  petHopTimer = setTimeout(()=>{
    const stageIdx = state ? getStageIndex(state.xp) : -1;
    const isLizardWall = state && state.species === 'wyrm' && stageIdx === 1;
    const sq = document.getElementById('petSquish');
    // ~55% chance each tick, and only for hatched, floor-anchored stages —
    // the wall-crawling Lizard already has its own full-time rotate/crawl
    // animation on the img itself, so a translateY hop on its wrapper would
    // just look like an unrelated wobble rather than a hop. Rich pets
    // (richAnim.raf running) get the spec's real crouch-arc-land Jump state
    // instead of the legacy petBigHop class.
    if(richAnim.raf && stageIdx > 0 && Math.random() < 0.55){
      playRichState('jump');
    } else if(sq && stageIdx > 0 && !isLizardWall && !richAnim.raf && Math.random() < 0.55){
      sq.classList.remove('big-hop'); void sq.offsetWidth;
      sq.classList.add('big-hop');
    }
    scheduleRandomHop();
  }, delay);
}

/* ============== 23. INIT ============== */
let meta = loadMeta();
let state = null;
function boot(){
  document.getElementById('createScreen').classList.add('hidden');
  // renderHouseScene() MUST run before renderPet(): renderPet() calls
  // renderCosmetics(), which now looks up #decorLayer *inside* the SVG
  // renderHouseScene() builds (room decor moved from separate HTML overlay
  // spans into <image> elements inside the room SVG itself — see the
  // SHOP_ITEMS comment on svgX/svgY/svgSize). Calling renderPet() first, as
  // this did before that change, would query #decorLayer before it exists.
  renderHouseScene();
  renderPet(false);
  renderActivityFeed();
  setScreen('home');
  const wb = wellbeing();
  if(wb < WELLBEING_PENALTY_THRESHOLD) showToast(`👋 Welcome back — ${state.name} could use some care!`);
}
(function init(){
  state = loadPetState();
  if(state){ tickNeeds(); boot(); }
  else { renderCreateScreen(); }
  scheduleRandomHop();
  setInterval(()=>{
    if(!state) return;
    tickNeeds();
    savePetState();
    renderPet(false);
  }, 60000);
})();
// Splash is purely a cover screen — everything above already rendered
// underneath it (home or the create screen); Start just reveals whichever
// one is actually there.
document.getElementById('splashStartBtn').addEventListener('click', ()=>{
  document.getElementById('splashScreen').classList.add('hidden');
});

// Offline cache — see app-sw.js. Requires a real origin (https:// or
// localhost), so this silently no-ops when the file is just opened locally.
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('app-sw.js').catch(()=>{});
  });
}
</script>
